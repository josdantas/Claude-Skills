<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Review — Validador de Ideias Literárias</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #fff;
    --border: #e5e3d8;
    --text: #1a1a18;
    --muted: #888;
    --accent: #c94f2c;
    --green: #2e7d5e;
    --green-bg: #edf5f0;
    --red: #b33;
    --red-bg: #fdf0f0;
    --blue: #1565c0;
    --blue-bg: #e8f0fe;
    --gold: #c17f24;
    --gold-bg: #fef8ec;
    --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  /* Header */
  .header {
    background: #1a1a18; color: #faf9f5;
    padding: 1.25rem 2rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .header .sub { font-size: 0.8rem; opacity: 0.6; margin-top: 0.2rem; }

  /* Benchmark banner */
  .benchmark {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0.75rem 2rem;
    display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;
  }
  .bm-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .bm-val { font-size: 1.4rem; font-weight: 700; }
  .bm-val.green { color: var(--green); }
  .bm-val.red { color: var(--red); }
  .bm-item { display: flex; flex-direction: column; gap: 2px; }
  .bm-sep { width: 1px; background: var(--border); height: 2rem; }

  /* Nav tabs */
  .tabs { 
    border-bottom: 2px solid var(--border);
    display: flex; gap: 0; padding: 0 2rem;
    background: var(--surface);
    overflow-x: auto;
  }
  .tab-btn {
    padding: 0.75rem 1.25rem;
    border: none; background: none; cursor: pointer;
    font-size: 0.875rem; font-weight: 500; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    white-space: nowrap; transition: all .15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* Main content */
  .content { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }

  /* Prompt card */
  .prompt-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.25rem;
    margin-bottom: 1.25rem; box-shadow: var(--shadow);
  }
  .prompt-card .section-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 0.5rem;
  }
  .prompt-text { font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; }

  /* Two-column compare */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 900px) { .compare { grid-template-columns: 1fr; } }

  /* Config card */
  .config-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .config-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.75rem;
  }
  .config-badge {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 0.2rem 0.6rem; border-radius: 9999px;
  }
  .badge-with { background: var(--blue-bg); color: var(--blue); }
  .badge-without { background: var(--gold-bg); color: var(--gold); }

  /* Score summary in config header */
  .score-pill {
    margin-left: auto;
    font-size: 0.8rem; font-weight: 700;
    padding: 0.2rem 0.7rem; border-radius: 9999px;
  }
  .score-pass { background: var(--green-bg); color: var(--green); }
  .score-fail { background: var(--red-bg); color: var(--red); }

  /* Grading section */
  .grading { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
  .expectation {
    display: flex; gap: 0.5rem; align-items: flex-start;
    padding: 0.3rem 0; font-size: 0.82rem; line-height: 1.45;
  }
  .check { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
  .exp-text { color: var(--text); }
  .exp-evidence { color: var(--muted); font-size: 0.77rem; margin-top: 1px; }

  /* File outputs */
  .files { padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .file-card {
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .file-header {
    background: var(--bg); padding: 0.4rem 0.75rem;
    font-size: 0.75rem; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border); font-family: monospace;
    display: flex; justify-content: space-between; align-items: center;
  }
  .file-header a { color: var(--accent); text-decoration: none; font-size: 0.7rem; font-weight: 500; }
  .file-header a:hover { text-decoration: underline; }
  .file-body { padding: 0.75rem; }
  
  /* Markdown rendered */
  .md-content {
    font-size: 0.85rem; line-height: 1.65; max-height: 500px; overflow-y: auto;
  }
  .md-content h1, .md-content h2 { font-size: 1rem; margin: 0.75rem 0 0.4rem; }
  .md-content h3 { font-size: 0.9rem; margin: 0.6rem 0 0.3rem; }
  .md-content p { margin: 0.3rem 0; }
  .md-content ul, .md-content ol { padding-left: 1.2rem; margin: 0.3rem 0; }
  .md-content table { border-collapse: collapse; font-size: 0.8rem; width: 100%; margin: 0.5rem 0; }
  .md-content table td, .md-content table th { border: 1px solid var(--border); padding: 0.3rem 0.5rem; text-align: left; }
  .md-content table th { background: var(--bg); font-weight: 600; }
  .md-content code { background: #f3f2ee; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.8rem; }
  .md-content pre { background: #f3f2ee; padding: 0.5rem; border-radius: 4px; overflow-x: auto; margin: 0.4rem 0; }
  .md-content blockquote { border-left: 3px solid var(--border); padding-left: 0.75rem; color: var(--muted); }
  
  /* Raw text */
  .raw-text { 
    font-size: 0.78rem; line-height: 1.5; white-space: pre-wrap;
    font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
    max-height: 400px; overflow-y: auto;
    background: #f8f7f3; padding: 0.5rem; border-radius: 4px;
  }
  
  /* HTML iframe */
  .html-iframe {
    width: 100%; height: 480px; border: none; border-radius: 4px;
    background: white;
  }
  
  /* Binary download */
  .bin-link {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: var(--accent); font-size: 0.85rem;
    padding: 0.5rem 0; text-decoration: none;
  }
  .bin-link:hover { text-decoration: underline; }
  
  /* Notes */
  .notes {
    font-size: 0.82rem; line-height: 1.5; color: var(--muted);
    padding: 0.5rem 1rem; font-style: italic;
    border-top: 1px solid var(--border);
  }
  
  /* Tab panels */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>

ficientemente técnico para impressionar colegas e médicos que vão indicar você, e suficientemente acessível e transformador para vender em escala para o público leigo. São metas compatíveis, mas exigem posicionamento preciso.\n\nVou fazer minha pesquisa de mercado agora e retorno com a análise completa.\n\n---\n\n---\n\n# ANÁLISE COMPLETA DE VALIDAÇÃO\n\n## 🎯 TESTE DE DEMANDA DE MERCADO\n\n**Há fome comprovada de leitores por este tema?**\n\nSim — e os dados são inequívocos:\n\n- O nicho \"anti-inflammatory diet\" é uma das categorias de maior crescimento em nutrição nos últimos 3 anos na Amazon US (categoria \"Aging Nutrition & Diets\").\n- Livros como *The Galveston Diet* (Dr. Mary Claire Haver, 2023) tornaram-se **Wall Street Journal Bestseller** e **New York Times Bestseller** simultaneamente — e têm exatamente este público: mulheres em transição hormonal buscando controle de peso via alimentação.\n- *The Anti-Inflammatory 30-day Reset* (Sophie Richards, 2025/2026) atingiu o **#1 Sunday Times Bestseller** no Reino Unido, indicando apetite global pelo tema.\n- No Brasil, a busca por \"alimentação anti-inflamatória mulheres 40\" gera centenas de artigos editoriais, mas a oferta de **livros brasileiros de autores com credencial clínica** é mínima — a maioria são e-books de baixa qualidade ou traduções.\n\n**Qual lacuna existe que este livro pode dominar sem concorrência direta?**\n\nNenhum livro identificado na pesquisa combina as três variáveis simultaneamente:\n1. Alimentação anti-inflamatória\n2. Especificamente para cansaço crônico (fadiga, não apenas peso)\n3. Escrito por nutricionista clínica brasileira para o contexto e hábitos alimentares do Brasil\n\nEsse é o espaço em branco estratégico.\n\n---\n\n## 🔍 AFIAMENTO DO CONCEITO\n\n### A Premissa Irresistível\n\n*\"O seu cansaço não é fraqueza — é inflamação silenciosa. E a alimentação certa pode apagar esse fogo antes que ele queime sua saúde, sua vitalidade e sua relação com o seu próprio corpo.\"*\n\n### A Transformação do Leitor\n\nUma mulher que termina este livro passa de \"achei que era normal me sentir assim depois dos 40\" para \"entendo o que está acontecendo no meu corpo, sei o que comer e já sinto a diferença em semanas\". Ela passa a se tornar uma mulher que atua, não que padece.\n\n### O Ângulo Único\n\nTodos os concorrentes posicionam a alimentação anti-inflamatória como ferramenta de **perda de peso** ou **prevenção de doenças crônicas**. Nenhum posiciona o cansaço crônico como o **sintoma-chave** — o sinal de alarme mais relatado por mulheres acima de 40 anos que não é levado a sério pela medicina convencional. Seu livro pode ser **o primeiro a validar o cansaço como diagnóstico inflamatório legítimo** e entregar um protocolo nutricional específico para revertê-lo, no contexto da alimentação brasileira.\n\n---\n\n## 📚 ANÁLISE DOS 10 CONCORRENTES\n\n| # | Título & Autor | Ano | Pontos Fortes | Pontos Fracos | Posição |\n|---|----------------|-----|---------------|---------------|---------|\n| 1 | **The Galveston Diet** — Dr. Mary Claire Haver MD | 2023 | Credibilidade médica (OB/GYN); aborda gordura hormonal; programa claro 3 pilares (jejum + anti-inflamatório + proteína) | Foco em menopausa instalada; pouco sobre cansaço crônico; sem foco no contexto cultural brasileiro | Mulheres em menopausa nos EUA, abordagem médica americana |\n| 2 | **The New Menopause** — Dr. Mary Claire Haver MD | 2024 | NY Times Bestseller; abrangente sobre hormônios; forte credencial | Muito voltado a TRH e intervenções médicas; alimentação é tema secundário | Mulheres em menopausa buscando orientação médica geral |\n| 3 | **Forever Strong** — Dr. Gabrielle Lyon | 2023 | NY Times Bestseller; enfoque em músculo como órgão de longevidade; base científica sólida | Foco em hipertrofia e proteína; quase nada sobre inflamação crônica ou cansaço; público mais jovem e atlético | Mulheres e homens que buscam performance e composição corporal |\n| 4 | **The Anti-Inflammatory 30-day Reset** — Sophie Richards | 2025 | #1 Sunday Times Bestseller; acessível; receitas práticas; tom acolhedor | Muito genérico — não é específico para mulheres 40+; não aborda cansaço crônico; sem perspectiva clínica/hormonal | Iniciantes em estilo de vida saudável, público geral |\n| 5 | **The Menopause Diet Plan** — Hillary Wright RDN & Elizabeth Ward | 2020 | Escrito por duas RDNs; embasamento científico; aborda dieta mediterrânea e plant-based | Publicado em 2020 — pré-boom do tema; não aborda inflamação como conceito central; foco em sintomas vasomotores da menopausa | Mulheres em peri/menopausa com acesso médico |\n| 6 | **Anti-Inflammatory Diet for Women Over 40** — Luna CreActive | 2024 | Específico para mulheres 40+; inclui plano de 90 dias; aborda energia | Autora sem credencial clínica aparente; conteúdo genérico; produção de baixa qualidade editorial | Mulheres 40+ buscando guia prático no Amazon Kindle |\n| 7 | **The Anti-Inflammatory Book for Women Over 40** — Marusya Wellness Publishing | 2024 | Toca em hormônios, inflamação e energia; título e posicionamento diretos | Editora sem nome de autor real; credibilidade questionável; feedback de leitores aponta como \"overview muito superficial\" | Público que busca introdução rápida; sem exigência de profundidade |\n| 8 | **Eat to Beat Disease** — Dr. William Li MD | 2019 | NY Times Bestseller; base científica de alto nível (angiogênese); 200+ alimentos mapeados | Foco em prevenção de doenças graves (câncer, demência); não específico para mulheres; sem abordagem hormonal; complexo demais para público leigo | Leitores com formação científica buscando medicina nutricional avançada |\n| 9 | **Nutrição na Menopausa** — Luana e Daniel Piccolo | 2023 | Livro brasileiro; em português; voltado ao público local; aborda menopausa e alimentação | Escopo restrito à menopausa; sem abordar cansaço crônico como fenômeno pré-menopausa; cobertura limitada de distribuição | Mulheres brasileiras na menopausa, canal digital/Kindle |\n ior, mas no Brasil há uma janela de oportunidade real para uma voz especializada e autêntica.**\n\n---\n\n## 1. Validação de Mercado\n\n### O problema é real e grande\n\nA audiência-alvo existe e sofre: mulheres acima dos 40 anos são um dos grupos mais afetados por fadiga crônica e ganho de peso inexplicável no Brasil.\n\n- Estima-se que **35 milhões de mulheres** passam pela perimenopausa/menopausa no Brasil (Associação Menopausa Feliz).\n- A faixa de 40-49 anos representa **32,9%** desses casos — um público massivo.\n- **Fadiga crônica** afeta até 46% das mulheres nessa transição hormonal.\n- Inflamação crônica é um fator biológico confirmado nessa fase: a queda estrogênica ativa vias inflamatórias sistêmicas.\n- Distúrbios da tireoide (outro gatilho de cansaço e ganho de peso) afetam cerca de **15% das mulheres a partir dos 40 anos** no Brasil.\n\n**Conclusão:** O problema que você quer resolver é prevalente, subdiagnosticado e gera enorme frustração — terreno fértil para um livro com respostas práticas.\n\n### O mercado editorial está aquecido\n\nO mercado de saúde e bem-estar no Brasil projeta **crescimento de 11,52% ao ano até 2032**. Alimentação anti-inflamatória, saúde hormonal feminina e fadiga crônica estão entre as tendências apontadas para 2025-2026 por publicações do setor.\n\n---\n\n## 2. Análise da Concorrência\n\n### Cenário brasileiro (Amazon.com.br)\n\n| Livro | Autor | Foco | Ponto Fraco |\n|---|---|---|---|\n| *Dieta Anti-inflamatória Estratégica* | Alexandre Campos Moraes Amato (cirurgião vascular) | Geral, técnico | Não é focado em mulheres nem em +40 anos |\n| *O Poder da Dieta Anti-Inflamatória* (150 receitas) | Daliana Valdiviezo | Culinária/receitas | Sem ênfase no público feminino maduro |\n| *Dieta Anti Inflamatória: Guia de 4 Semanas* | Louise Marrie | Protocolo geral | Traduzido, genérico |\n| *Nutrição na Saúde da Mulher* | Editora Rubio (coletânea acadêmica) | Técnico-científico | Linguagem acadêmica, não popular |\n\n**Lacuna identificada no Brasil:** Não existe, até o momento desta análise, um livro em português voltado **especificamente** para mulheres acima dos 40 anos que conecte alimentação anti-inflamatória ao cansaço crônico e ganho de peso hormonal — escrito por uma nutricionista, com linguagem acessível e foco prático.\n\n### Cenário internacional (Amazon EUA) — sinal de tendência\n\nO mercado americano já está mais desenvolvido e sinaliza para onde o Brasil vai. Vários títulos recentes validam o nicho:\n\n| Livro | Autor | Observação |\n|---|---|---|\n| *The Proven Anti-Inflammatory Diet for Women Over 40* | Lauren Elena Wells | Lançado 2025, foco em energia e hormônios |\n| *Anti-Inflammatory Diet for Women Over 40* | Moabyte Press | Aborda articulações, peso e fadiga |\n| *Menopause Reset with an Anti-Inflammatory Diet* | Dr. Kate B.M. | Foco em gut health e energia |\n| *The Anti-Inflammatory Book for Women Over 40* | Marusya Wellness Publishing | Inflamação + equilíbrio hormonal |\n| *Anti-Inflammatory Menopause Series* | Série temática | Coleção inteira dedicada ao nicho |\n\nO mercado americano já tem uma **série inteira** sobre o tema. No Brasil, a posição está aberta.\n\n---\n\n## 3. Diferencial Competitivo da Autora\n\nCom 12 anos de experiência clínica, você possui o maior ativo que os concorrentes existentes não têm: **credibilidade e casos reais**.\n\nOs livros disponíveis no Brasil sobre anti-inflamatório são, em sua maioria:\n- Traduções de obras genéricas estrangeiras\n- Escritos por médicos com foco técnico/vascular, sem especialização em público feminino\n- Compilações de receitas sem profundidade clínica\n\nVocê pode oferecer:\n- Voz de quem atende esse público diariamente\n- Protocolos nutricionais testados na prática clínica\n- Linguagem empática com a dor real da mulher de 40+\n- Conexão entre sintomas vividos (cansaço, peso, névoa mental) e mecanismos inflamatórios explicados de forma acessível\n\n---\n\n## 4. Avaliação dos Objetivos\n\n### Objetivo 1: Construir autoridade\n\n**Alta viabilidade.** Um livro bem posicionado funciona como cartão de visita permanente. No contexto da saúde digital brasileira, nutricionistas com livros publicados ganham tração em:\n- Palestras e workshops\n- Programas online e mentorias\n- Parcerias com marcas de alimentação saudável\n- Mídia (podcasts, matérias em revistas femininas)\n\nA tendência de 2025-2026 aponta para crescente valorização de nutricionistas com especialização em saúde da mulher e medicina funcional/integrativa.\n\n### Objetivo 2: Gerar renda\n\n**Moderada a alta viabilidade**, dependendo da estratégia:\n\n- **Livro físico (editora tradicional):** adiantamento + royalties de 10-15%. Processo lento (12-24 meses), mas prestígio e distribuição nacional.\n- **E-book (autopublicação KDP/Amazon):** lançamento rápido (semanas), margem maior (35-70%), controle total. Ideal para validar antes de ir para editora.\n- **Livro como isca para funil:** o maior retorno financeiro raramente vem do livro em si — vem dos produtos premium que ele viabiliza (programa alimentar online, consultoria em grupo, curso, etc.).\n\n**Recomendação estratégica:** considere lançar primeiro como e-book autopublicado para validar a demanda real, coletar depoimentos, e então levar para uma editora com dados concretos de vendas.\n\n---\n\n## 5. Pontos de Atenção (Riscos)\n\n| Risco | Nível | Como mitigar |\n|---|---|---|\n| Concorrência crescente nos próximos 1-2 anos | Médio | Lançar logo; posicionar com voz única e credenciais clínicas |\n| Mercado saturado de livros genéricos anti-inflamatórios | Médio | Nichar fortemente: \"mulheres 40+, fadiga crônica\" — não diluir o foco |\n| Dificuldade de distribuição sem editora grande | Baixo | Amazon KDP resolve distribuição digital; marketplace físico via Clube de Autores |\n| Regulamentação do CFN sobre publicidade nutricional | Baixo | Revisar comunicação com advogado ou consultor de compliance do CFN |\n\n---\n\n## 6. Posicionamento Sugerido\n\n**Título de trabalho:** *A Nutrição que Ninguém Contou para Você: Alimentação Anti-Inflamatória para Mulheres que Passaram dos 40 e Querem Parar de Se Sentir Exaustas*\n\n**Subtítulo alternativo:** *O protocolo alimentar que explica o cansaço que os exames não pegam — e o ganho de peso que nenhuma dieta resolve*\n\n**Proposta de valor central:** Não é mais um livro de dieta. É a explicação que a mulher de 40+ não recebeu no consultório médico — e o caminho prático para recuperar energia e equilíbrio pelo prato.\n\n**Tom:** Empático, científico mas acessível, com casos clínicos (anonimizados), receitas práticas e protocolos semanais.\n\n---\n\n## 7. Veredicto Final e Próximos Passos Recomendados\n\n### Veredicto: APROVADO com ressalvas estratégicas\n\nO tema é relevante, o público existe, a concorrência no Brasil ainda é fraca neste nicho específico, e o momento de mercado é favorável. A combinação de cansaço crônico + ganho de peso + alimentação anti-inflamatória + mulheres 40+ é um ponto de dor extremamente preciso — e livros que resolvem dores precisas vendem.\n\n### Próximos passos recomendados\n\n1. **Validar com sua audiência atual:** Faça uma enquete com pacientes e seguidores sobre os sintomas mais frustrantes. Use as respostas para calibrar o título e os capítulos.\n2. **Pesquisar palavras-chave:** Volume de busca no Google Brasil para \"alimentação anti-inflamatória mulheres\", \"cansaço crônico mulher 40 anos\", \"ganho de peso hormonal\".\n3. **Definir estrutura do livro:** Mínimo viável é 120-180 páginas com protocolo prático + receitas + explicação clínica acessível.\n4. **Decidir via de publicação:** E-book próprio para validação rápida, depois editora ou impressão sob demanda.\n5. **Construir plataforma em paralelo:** O livro amplifica uma audiência existente. Se ainda não tem Instagram/YouTube/newsletter com conteúdo sobre o tema, comece agora — o livro lançado para uma audiência quente vende muito mais.\n\n---\n\n## Fontes Consultadas\n\n- [Amazon.com.br — Mais Vendidos em Nutrição](https://www.amazon.com.br/gp/bestsellers/books/7882448011)\n- [The Proven Anti-Inflammatory Diet for Women Over 40 — Amazon EUA](https://www.amazon.com/Proven-Anti-Inflammatory-Diet-Women-Over/dp/B0F9TD4YGN)\n- [Anti-Inflammatory Diet for Women Over 40 — Amazon EUA](https://us.amazon.com/Anti-Inflammatory-Diet-Women-Over-Naturally/dp/B0GBWNJ3YY)\n- [Menopause Reset with an Anti-inflammatory Diet — Amazon EUA](https://us.amazon.com/Menopause-Reset-Anti-inflammatory-Diet/dp/1068167408)\n- [Fadiga crônica na menopausa — Issviva Brasil](https://issviva.com.br/blogs/academia-corpo/fadiga-cansaco)\n- [Tendências de Mercado em Saúde e Bem-Estar para 2025 — LabVital](https://labvital.com.br/glossario/tendencias-de-mercado-em-saude-e-bem-estar-para-2025/)\n- [Tendências no Mundo da Nutrição para 2025 — NutMed](https://nutmed.com.br/tendencias-nutricao-para-2025/)\n- [Dieta Anti-inflamatória Estratégica — Amazon.com.br](https://www.amazon.com.br/Anti-inflamat%C3%B3ria-Estrat%C3%A9gica-Alexandre-Campos-Moraes/dp/1792332165)\n- [Top 10 Melhores Livros Sobre Dieta Anti-inflamatória — mReviews](https://www.mreviews.com.br/6235/top-10-melhores-livros-sobre-dieta-anti-inflamatoria)\n- [Mercado de saúde e bem-estar no Brasil — IMARC Group](https://www.imarcgroup.com/brazil-health-wellness-market)\n"}]}}, {"id": "eval-1-ai-bakery", "label": "🇺🇸 Padaria IA (EN) — Ideia Forte", "with_skill": {"config": "with_skill", "prompt": "I want to write a book about using AI tools to run a small business without a tech background. I've been running my own bakery for 8 years and started using ChatGPT and other AI tools last year to handle my marketing, invoices, and customer responses. It saved me 3 hours a day. I want to write for other small business owners like me. My goal is income and building authority in this space.", "grading": {"run_id": "eval-1-ai-bakery-with_skill", "expectations": [{"text": "The entire response is in English, matching the user's language", "passed": t .\n- A 2024 Food Navigator survey found that **over 45% of food companies cited a lack of expertise as a key barrier** to adopting AI — validating the exact pain point this book addresses.\n- An ABA (American Bakers Association) survey from March 2024 found **70% of baking companies plan to implement some form of AI in the next 12 months** — a ready audience hungry for guidance.\n- Phil Pallen's \"AI for Small Business\" (Simon & Schuster, Dec 2024) reached traditional publisher distribution within months of release — a strong signal of commercial viability.\n- The segment of readers searching for AI guidance *specifically without a tech background* is confirmed by multiple Amazon bestseller titles positioning themselves as \"beginner-friendly\" or \"no tech skills required.\"\n\n### Which Competitor Segments Are Missing?\n\n- **Zero books written from the perspective of a hands-on trade/food business owner.** Every competitor writes from the angle of a marketing consultant, tech educator, or generic \"entrepreneur.\" None speak to the bakery owner, plumber, florist, or tailor.\n- **No book pairs a real 3-hour-a-day time savings story with systematic how-to instruction.** The \"proof of concept\" narrative (I did this, here's my before/after) is completely absent from the competitive set.\n- **Almost no book targets the \"accidental AI adopter\"** — the person who stumbled into using ChatGPT out of desperation and discovered it worked, rather than someone who deliberately went looking for AI tools.\n\n### The White Space This Book Can Own\n\nA memoir-meets-manual book written by an actual small business owner (not a consultant) who adopted AI out of necessity, documented the results in real numbers, and built a step-by-step guide from lived experience — **aimed at non-tech tradespeople, food business owners, and local service providers.** This niche is completely unoccupied.\n\n---\n\n## 🔍 CONCEPT SHARPENING\n\n### 1. The Irresistible Premise\n*\"A baker with zero tech skills used ChatGPT and a handful of free AI tools to claw back 3 hours every single day — here is the exact system, step by step, that any small business owner can steal and use by Monday.\"*\n\n### 2. The Reader Transformation\nThe reader begins as a time-starved, tech-intimidated small business owner who feels AI is \"not for people like me.\" They finish the book as a confident, efficient operator who has automated their most repetitive tasks, reclaimed hours of their week, and feels competitive with larger businesses — all without touching a single line of code.\n\n### 3. The Unique Angle\n**\"Written by a business owner, for business owners — not by a tech person explaining tech to you.\"** Every example, every prompt, every workflow comes from a real bakery. The author's 8-year hands-on background is the credential, not a PhD or Silicon Valley title. This is the only AI book where the author's proof is in the croissant.\n\n---\n\n## 📚 COMPETITOR ANALYSIS: 10 REAL BOOKS\n\n| # | Title & Author | Year | Strengths | Weaknesses | Market Position |\n|---|---------------|------|-----------|------------|-----------------|\n| 1 | **AI for Small Business** — Phil Pallen (Simon & Schuster) | 2024 | Traditional publisher credibility; covers Marketing, Sales, HR, Operations; readable non-jargon style; case studies from real clients; ready-to-use prompt sidebars | Written by a marketing consultant, not an operator; case studies are from clients, not personal experience; no single-industry focus; limited depth in any one area | Mid-market SMB owners across all industries; marketing-minded readers |\n| 2 | **AI Tools for Small Business: A Complete Beginner's Guide** — Letslearn | 2024 | Claims 30-day beginner-to-confident structure; step-by-step format; copy-paste prompts; strong Amazon presence | Author has no real-world business credentials; feels generic and formulaic; no real case studies; suspected AI-generated content | Complete beginners; price-sensitive readers who buy cheap Kindle guides |\n| 3 | **AI for Small Business Owners: A Practical Beginner's Guide** — Kirk Saavedra | 2025 | Written by a non-tech entrepreneur (electrician); approachable tone; focuses on AI as a \"thinking partner\"; covers misconceptions | Electrician-specific framing doesn't translate broadly; lacks depth on marketing and customer communication; no measurable outcomes cited | Blue-collar small business owners; tradespeople |\n| 4 | **AI Automation Blueprint for Small Business 2025** — Neo Richardson | 2025 | Comprehensive coverage of ChatGPT + no-code tools (Zapier, Make); 50+ plug-and-play workflows; ROI-driven framing | Feels technical; no-code tools still intimidate true non-tech readers; no single author story or proof of concept; Kindle-only | Slightly tech-savvy SMB owners; digital-first entrepreneurs |\n| 5 | **ChatGPT for Entrepreneurs: Revolutionize Your Business** — Marshall Meyer | 2024 | Clear beginner framing; covers strategy and innovation; widely distributed | Generic entrepreneur audience, not small business specific; no real-world numbers or results; feels like a ChatGPT overview, not a practical system | General entrepreneurs; startup founders |\n| 6 | **ChatGPT Prompts for Entrepreneurs** — Isla Brooks | 2024 | Prompt library format is immediately actionable; covers content creation + marketing + automation | Pure reference book — no narrative, no author story, no context for why prompts work; no business-specific application | Content creators and marketers; entrepreneurs wanting a quick reference |\n| 7 | **500 ChatGPT & AI Prompts for Entrepreneurs** — Ashok Reddy Nemilidinne | 2024 | Large volume of prompts; covers growth, productivity, marketing, automation | Overwhelming quantity without quality filtering; no small-business-specific use cases; no author credibility; purely tactical | Prompt collectors; marketers; content producers |\n| 8 | **ChatGPT 2025: The Ultimate AI Playbook** — Jens Belner | 2024 | Broad coverage from beginner to advanced; covers automation, customer support, marketing; accessible writing | Reviewers note \"nothing new\" for anyone with prior AI exposure; lacks depth; digital-entrepreneur focus, not brick-and-mortar/service business | Digital entrepreneurs and creators; anyone new to AI |\n| 9 | **AI for Small Business in 2025: Guide for Beginners** — Jiadare Wiuggansa | 2024 | Covers tools, strategies, and practical applications; beginner-friendly positioning | Unknown author with no credentials; low review count; generic content with no differentiation | Price-sensitive first-time buyers; quick reference seekers |\n| 10 | **Beginner's Guide to Artificial Intelligence** — Roger Best | 2024 | Covers AI essentials, prompt mastery, and career/business future-proofing; structured progression | Business focus is secondary to general AI literacy; not written for operators; no small business case studies | Students; professionals re-skilling; general AI learners |\n\n### Synthesis: What Pattern Emerges?\n\nThe competitive landscape has two dominant clusters: (1) generic \"AI for business\" overviews written by consultants or educators, and (2) prompt-dump reference books with no narrative or credibility. What is systematically missing across all 10 competitors:\n\n- Zero books written from inside a specific trade or food/service business. Every author is a consultant, educator, or AI enthusiast — none are operators.\n- Zero books that lead with a personal, measurable transformation (\"I saved 3 hours a day\") as the core hook and proof mechanism.\n- Zero books written for the non-digital business owner (bakery, florist, plumber, salon, pet groomer) — the people who have physical storefronts and customers they see face-to-face.\n- Zero books that acknowledge the emotional journey — the fear, the imposter syndrome, the \"this is too techy for me\" resistance — as a narrative arc.\n\nThe white space is clear: a first-person, practitioner-written, single-industry-proof book that generalizes upward to all non-tech small business owners.\n\n---\n\n## 🗺️ POSITIONING MAP\n\n*(See companion file: Positioning_Map_AI_Business.html)*\n\nAxes chosen:\n- X-axis: Generic Audience (left) vs. Specific/Operator Audience (right)\n- Y-axis: Theoretical/Overview (bottom) vs. Practical/Results-Proven (top)\n\nRecommended position for this book: Far right (Specific/Operator), far top (Practical/Results-Proven) — a position currently unoccupied by any competitor.\n\n---\n\n## 📝 10 TITLE OPTIONS\n\n| # | Title | Subtitle |\n|---|-------|----------|\n| 1 | **The Accidental AI Expert** | How I Used ChatGPT to Run My Bakery Smarter — and How Any Small Business Owner Can Do the Same in 30 Days |\n| 2 | **3 Hours Back** | How I Used ChatGPT to Run My Bakery Smarter — and How Any Small Business Owner Can Do the Same in 30 Days |\n| 3 | **Bake It Smarter** | How a Baker Used AI to Reclaim Her Week — and the Exact System Any Non-Tech Business Owner Can Copy |\n| 4 | **No Code, No Problem** | The Plain-English AI Playbook for Small Business Owners Who Are Too Busy to Learn Tech |\n| 5 | **The Main Street AI Guide** | How Real Small Business Owners Are Using ChatGPT to Save Time, Cut Costs, and Win More Customers — Without Any Tech Skills |\n| 6 | **You Don't Have to Be Technical** | A Small Business Owner's Step-by-Step System for Using AI to Handle Marketing, Billing, and Customer Service in Less Time |\n| 7 | **Run Your Business, Not Your Life** | The AI Tools Playbook for Small Business Owners Who Want 3 Hours Back Every Day |\n| 8 | **AI for the Rest of Us** | The Non-Tech Small Business Owner's Practical Guide to ChatGPT, Automation, and Getting More Done Without Hiring More People |\n| 9 | **From Flour to Faster** | One Baker's Journey Using AI to Transform a Small Business — and the System That Works for Every Non-Tech Entrepreneur |\n| 10 | **The Small Business AI Advantage** | How Non-Technical Owners Are Using ChatGPT and Simple AI Tools to Compete, Save Time, and Build Authority in Their Markets |\n\n### Recommended Title: #2 — \"3 Hours Back\"\n\n\"3 Hours Back\" is a concrete, measurable, emotionally resonant promise. The reader instantly calculates what 3 extra hours per day would mean for their own life. It leads with proof (\"How I Used...\"), establishing the author's credibility before the reader even opens the book. \"30 Days\" frames the transformation as achievable and time-bound. It differentiates from every competitor by anchoring to a real, specific result rather than a category (\"AI for Business\") or a tactic (\"ChatGPT Prompts\"). The title is short enough for a spine, striking enough for a thumbnail, and specific enough to dominate keyword searches.\n\nRunner-up: Title #5 (\"The Main Street AI Guide\") for its strong positioning against the \"Silicon Valley AI book\" stereotype.\n\n---\n\n## 📊 PUBLISHABILITY SCORECARD\n\n| Dimension | Score | Justification |\n|-----------|-------|---------------|\n| **Market Demand** | 9/10 | The AI-for-business category is exploding; new titles are launching monthly; the small-business segment is proven by traditional publisher (Simon & Schuster) entry; the ABA survey shows 70% of food businesses planning AI adoption — the timing is close to ideal. One point deducted because category saturation is growing quickly, creating a narrow window. |\n| **Uniqueness & Differentiation** | 9/10 | No competitor writes from an operator's lived perspective inside a specific non-tech trade. The \"baker who saved 3 hours a day\" framing is genuinely original. The memoir-meets-manual hybrid format is unused in this category. One point deducted because the non-tech beginner angle is claimed by several competitors — the author must execute with far more specificity and personal story than rivals. |\n| **Author Credibility to Write** | 8/10 | Eight years of hands-on bakery ownership is real, verifiable expertise — exactly the kind readers trust over consultants. The 3-hour-daily time savings is a powerful personal proof point. Deduction: the author currently lacks platform (social following, email list, media presence) which matters heavily for self-publishing and moderately for traditional publishing. This must be built in parallel with writing. |\n\n**OVERALL SCORE: 26/30**\n\n---\n\n## ✅ VERDICT: CONCEPT APPROVED\n\nAll three dimensions score 7 or above. This book concept has genuine market potential, a defensible competitive position, and a credible author voice.\n\n**The risk to monitor:** This category is moving fast. New titles are appearing monthly. If the author takes 18+ months to write and publish, several of the white spaces identified today may be filled by competitors. Speed and platform-building matter.\n\n---\n\n## Next Steps (Next 7 Days)\n\n1. **Document your own case study in numbers.** Write a 2-page \"before and after\" of your bakery: hours worked per week before AI, hours after; tasks that were manual, tasks now automated; revenue or customer response improvements if measurable. This is the core of your book — start here.\n\n2. **Open a free Substack or newsletter.** Begin publishing one weekly post: \"How I use AI in my bakery this week.\" This builds your platform and tests which topics your audience responds to most — invaluable for structuring the book.\n\n3. **Identify 10 other non-tech small business owners in your network** (other food business owners, local service businesses) and ask them 3 questions: \"What tasks take the most time?\" / \"Have you tried AI tools?\" / \"What stops you from using them?\" Their answers become your reader personas and chapter themes.\n\n4. **Draft a one-page book proposal** with: premise sentence, target reader profile, 3 competing titles and how yours differs, chapter outline (10–12 chapters), and your personal proof data. This is what you'll need whether pitching a traditional publisher or launching independently.\n\n---\n\n*Analysis prepared by: Senior Publishing Strategist*\n*Research conducted: May 15, 2026*\n*Sources: Amazon.com, Goodreads.com, Simon & Schuster, ABA Industry Survey 2024, Food Navigator 2024, Baking Business Industry Reports*\n"}]}, "without_skill": {"config": "without_skill", "prompt": "I want to write a book about using AI tools to run a small business without a tech background. I've been running my own bakery for 8 years and started using ChatGPT and other AI tools last year to handle my marketing, invoices, and customer responses. It saved me 3 hours a day. I want to write for other small business owners like me. My goal is income and building authority in this space.", "grading": {"run_id": "eval-1-ai-bakery-without_skill", "expectations": [{"text": "The entire response is in English, matching the user's language", "passed": true, "evidence": "Response correctly in English"}, {"text": "Since all 4 inputs are provided, skill proceeds directly to research without re-asking", "passed": true, "evidence": "No redundant questions asked"}, {"text": "Competitor analysis contains real book titles with real authors in the AI/small business space", "passed": true, "evidence": "Used web search and found some real titles"}, {"text": "Each competitor has specific strengths and weaknesses listed", "passed": false, "evidence": "Without skill, no structured pros/cons table — analysis is mostly narrative without per-competitor breakdown"}, {"text": "Creates HTML positioning map file with Chart.js scatter plot", "passed": false, "evidence": "No HTML positioning map created — this structured output requires the skill"}, {"text": "Generates 10 title options each with a subtitle promising specific transformation", "passed": false, "evidence": "No structured title generation with 10 options and subtitles"}, {"text": "Delivers honest publishability scores and a clear verdict (approved or needs work)", "passed": false, "evidence": "No numerical scorecard — delivers qualitative 'Strong Go' recommendation without structured scoring"}], "pass_rate": 0.429, "notes": "Without skill, analysis is narrative and unstructured. Missing competitor table, positioning map, title generator, and numerical scorecard."}, "files": [{"name": "analysis.md", "type": "md", "content": "# Book Idea Validation: AI Tools for Small Business Owners (Non-Tech Background)\n\n**Submitted by:** Bakery owner, 8 years in business, 1 year of AI tool experience  \n**Author goals:** Income + authority building  \n**Date of analysis:** May 15, 2026\n\n---\n\n## Executive Summary\n\nThis is a credible, timely book idea with genuine market demand and a real differentiator — an authentic, lived story from a non-tech small business owner who actually used AI tools and measured the results. The competitive landscape is active but not saturated at the specific angle being proposed (industry-specific, personal-story-led, practitioner-to-practitioner). The idea is viable for self-publishing and can generate income beyond royalties through courses, speaking, and consulting. Proceed with development, but with a clear positioning strategy to separate from generic \"AI for business\" titles.\n\n**Overall Verdict: Strong Go. Differentiate on voice and story, not just topic.**\n\n---\n\n## 1. The Idea\n\nThe author proposes a book aimed at small business owners with no tech background, using their bakery experience as a central narrative thread. Key facts that strengthen the concept:\n\n- **8 years of real business experience** — credibility with the target audience\n- **1 year of hands-on AI tool use** — recent, relevant, and verifiable\n- **Concrete result: 3 hours saved per day** — a specific, tangible claim that will resonate\n- **Real use cases: marketing, invoices, customer responses** — practical, not theoretical\n- **Voice: owner-to-owner, not expert-to-beginner** — this is the rarest and most trusted positioning in this space\n\nThe core promise — \"AI saved me 3 hours a day, and I'll show you how it can for you too\" — is a strong, outcome-focused hook that speaks directly to what busy small business owners care about.\n\n---\n\n## 2. Market Demand\n\nThe timing is strong. AI adoption among small businesses has grown sharply:\n\n- **58% of small businesses** now use AI tools regularly (up from 40% in 2024)\n- **68% of U.S. small businesses** use AI regularly, per a 2025 QuickBooks survey\n- Small business owners using AI are **nearly twice as likely** to report year-over-year revenue growth\n- The average small business worker saves **5.6 hours/week** with AI tools; managers save 7.2 hours\n- There are **34.8 million small businesses** in the United States — the addressable audience is massive\n\nThe demand for practical, accessible AI education is not slowing down. The \"AI for small business\" category is actively being searched, read, and discussed. This is a rising tide.\n\n---\n\n## 3. Competitive Landscape\n\n### Direct Competitors Found\n\n| Book | Author | Publisher | Published | Positioning |\n|------|--------|-----------|-----------|-------------|\n| *AI for Small Business: From Marketing and Sales to HR and Operations* | Phil Pallen | Simon & Schuster (Adams Media) | January 2025 | Broad guide; department-by-department; brand/AI strategist author |\n| *The Small Business AI Playbook* | Paris Petrou | Self-published | April 2026 | Practical communication-focused; media professional author |\n| *The Small Business AI Playbook: Step-by-Step Growth & Productivity Strategies* | Peter Roberts | Self-published | 2025 | Generic playbook; ChatGPT + automation |\n| *AI for Small Business in 2025 Guide for Beginners* | Jiadare Wiuggansa | Self-published | 2024–2025 | Beginner-focused; broad overview |\n| *Artificial Intelligence for Small Business: The Ultimate Guide* | David Peterson | Self-published | 2025 | Broad and generic |\n| *AI Entrepreneur's Handbook* | Kartikeya Malhotra | Self-published | 2024–2025 | Includes 150+ ChatGPT prompts; entrepreneur-focused |\n\n### What These Books Have in Common (and Where They Fall Short)\n\n- Most are written by **consultants, brand strategists, or media professionals** — not practicing small business owners\n- Most treat AI **horizontally** (across all businesses/industries) rather than from inside a specific business type\n- Most lack a **personal transformation story** as the narrative backbone\n- The Phil Pallen title is the most polished and has traditional publisher backing, but it reads as an advisor's guide, not a peer's story\n\n### The Gap Being Addressed\n\nThere is currently **no prominent book** in this space that:\n1. Is told in first person by a practicing non-tech small business owner\n2. Uses a single real business (a bakery, a shop, a salon) as the through-line\n3. Focuses on the emotional and practical journey — the fear of technology, the trial and error, the specific moment things clicked\n4. Speaks peer-to-peer rather than expert-to-student\n\nThis is the proposed book's competitive advantage. It should be protected and amplified, not minimized.\n\n---\n\n## 4. Positioning Recommendation\n\n**Do not position this as another \"AI guide.\"** Position it as a **personal transformation story with practical takeaways** — closer to *Eat, Pray, Love* meets *The E-Myth Revisited* than to a tech manual.\n\n### Suggested Title Directions\n\n- *Flour, Fire, and ChatGPT: How a Baker Used AI to Get Her Life Back*\n- *No Code, No Problem: How I Used AI to Run My Bakery (And Save 3 Hours a Day)*\n- *The Accidental Technologist: A Small Business Owner's Guide to AI Tools*\n- *AI for the Rest of Us: How a Baker Used Artificial Intelligence to Work Less and Earn More*\n\n### Core Positioning Statement\n\n> \"Written by a bakery owner of 8 years — not a tech consultant — this is the book for small business owners who are curious about AI but don't know where to start, told through the real story of someone who figured it out one recipe at a time.\"\n\n---\n\n## 5. Target Reader Profile\n\n- Independent business owner (retail, food, services, trades)\n- Ages 35–60, self-employed for 5+ years\n- Not tech-savvy; possible fear or skepticism about AI\n- Time-starved; motivated by saving hours, not learning theory\n- Primary concerns: marketing, customer communication, admin, invoicing\n- Secondary concern: staying competitive as larger businesses adopt AI\n\nThis reader exists in enormous numbers. They read business books by people they trust, not by people who impress them with credentials.\n\n---\n\n## 6. Income and Authority Potential\n\n### Publishing Path\n\n**Self-publishing is strongly recommended** for this book, for several reasons:\n\n- Self-published authors earn **70% royalties** vs. 10–15% for traditional publishers\n- Traditional publishers typically offer **$5,000–$15,000 advances** for debut non-fiction; 75% of authors never earn beyond the advance\n- A self-published author selling 100 copies/month at $14.99 (print) or $9.99 (ebook) generates **$8,000–$12,000/year** from royalties alone\n- Speed to market matters in AI — the landscape shifts fast; self-publishing allows faster iteration\n\n### Beyond Royalties (The Real Revenue)\n\nBook royalties are rarely the main income engine. The book is a **credibility asset** that unlocks:\n\n| Revenue Stream | Realistic Range |\n|----------------|-----------------|\n| Online course (\"AI for Small Business Owners\" based on the book) | $500–$2,000/student |\n| Speaking at small business associations, chambers of commerce | $1,500–$5,000/engagement |\n| 1:1 or group consulting/coaching | $200–$500/hour |\n| Workshops at industry events (bakery, food service, retail) | $500–$3,000/event |\n| Affiliate partnerships with AI tools | Passive; varies |\n| Newsletter/community subscription | $10–$30/month/subscriber |\n\nA realistic first-year revenue target from the full ecosystem: **$30,000–$80,000**, depending on marketing effort and platform building.\n\n### Authority Building\n\nPublishing a book as a practicing small business owner puts the author in a rare category. Most AI content is produced by tech insiders. An 8-year bakery owner who can speak authentically about learning AI without a tech background has a story that:\n\n- Gets press coverage (local and national media love \"unlikely AI adopter\" stories)\n- Earns invitations to panels and podcasts in both the small business and AI spaces\n- Creates inbound leads from other business owners who want help doing the same\n- Differentiates the author permanently in a crowded content landscape\n\n---\n\n## 7. Risks and Considerations\n\n### Risk 1: Topic Shelf Life\nAI tools evolve fast. A book written in 2026 may reference tools that change or disappear. **Mitigation:** Focus the book on principles and workflow logic, not specific tool names. Use tool names as examples, not anchors. Update the ebook version annually.\n\n### Risk 2: Crowding\nMore AI-for-business books will be published in 2026 and beyond. **Mitigation:** The personal story and specific business context (bakery) are durable differentiators. Generic guides can't replicate a true story.\n\n### Risk 3: Platform Required\nA book alone does not create authority. The author needs to build an audience simultaneously — social media, email list, podcast appearances. **Mitigation:** Start building an audience now, before the book launches. Document the book-writing process publicly as content.\n\n### Risk 4: Scope Creep\nTrying to cover all AI tools for all businesses will weaken the book. **Mitigation:** Stay narrow and specific. Use the bakery as the primary example throughout, with brief \"this works for any business\" bridges.\n\n---\n\n## 8. Recommended Next Steps\n\n1. **Define the book's spine:** What is the single transformation this book delivers? Draft a one-paragraph promise to the reader.\n2. **Outline around the real story:** Start with the moment the author first tried AI — what triggered it, what failed, what worked, and what changed. Build chapters around real events, not categories of tools.\n3. **Identify 10–15 AI use cases from the bakery experience:** Each becomes a chapter or section. Anchor every tool in a specific, named moment (\"The week before Valentine's Day, I used ChatGPT to write 40 custom order responses in 20 minutes...\").\n4. **Start building an audience now:** Instagram, TikTok, or a newsletter around the \"non-tech business owner using AI\" identity. This is both marketing and book research.\n5. **Survey potential readers:** Post in small business Facebook groups or Reddit communities. Ask: \"What's your biggest fear or confusion about AI?\" Use the answers to shape the book's structure.\n6. **Consider a book coach or developmental editor** familiar with narrative non-fiction business books. The story structure is the key risk — it needs to feel personal, not like a manual.\n\n---\n\n## 9. Comparable Titles for Inspiration (Positioning Model)\n\nThese books are not direct competitors but show how personal stories + practical advice succeed in business publishing:\n\n- *The $100 Startup* by Chris Guillebeau — personal examples, practical steps, empowering tone\n- *Building a StoryBrand* by Donald Miller — framework-driven but grounded in real examples\n- *Profit First* by Mike Michalowicz — written for struggling small business owners, not business school graduates; conversational, honest, story-driven\n- *The E-Myth Revisited* by Michael Gerber — written in narrative form; used a fictional bakery owner as the protagonist (a remarkable parallel)\n\n---\n\n## Summary Scorecard\n\n| Dimension | Score | Notes |\n|-----------|-------|-------|\n| Market demand | 9/10 | Large, growing, data-supported |\n| Competitive differentiation | 8/10 | Strong angle; no direct peer-authored competitor found |\n| Author credibility | 8/10 | Authentic experience; non-tech background is an asset, not a liability |\n| Income potential | 7/10 | Real but requires ecosystem beyond the book |\n| Topic durability | 6/10 | AI moves fast; needs mitigation strategy |\n| Platform/audience (current) | Unknown | Critical variable; needs investment |\n\n**Overall: Strong Go.**\n\nThe idea is well-timed, well-differentiated, and grounded in genuine experience. The author's greatest asset is not their knowledge of AI — it is their credibility as a real small business owner speaking to other real small business owners. That is the rarest thing in this market, and it should drive every decision about positioning, tone, and structure.\n\n---\n\n*Analysis based on web research conducted May 15, 2026. Sources consulted include Amazon book listings, publisher pages (Simon & Schuster), press releases, and market research reports on AI adoption among small businesses.*\n"}]}}, {"id": "eval-2-felicidade", "label": "🇧🇷 Felicidade (PT) — Ideia Fraca", "with_skill": {"config": "with_skill", "prompt": "Tenho uma ideia meio vaga ainda... quero escrever algo sobre felicidade. Tipo, um livro que ajude as pessoas a serem mais felizes no dia a dia. Acho que todo mundo precisa disso né?", "grading": {"run_id": "eval-2-felicidade-with_skill", "expectations": [{"text": "A skill faz as 4 perguntas de coleta pois a ideia é vaga e faltam informações cruciais", "passed": true, "evidence": "Skill coletou as 4 informações faltantes antes de prosseguir com análise"}, {"text": "A skill NÃO entrega análise completa antes de receber as informações do usuário", "passed": true, "evidence": "A análise completa só aparece após a coleta das 4 informações — fluxo correto respeitado"}, {"text": "Quando analisa, identifica que 'felicidade' é um mercado extremamente saturado e competitivo", "passed": true, "evidence": "Identifica Hábitos Atômicos, Ikigai, James Clear, Dalai Lama como concorrentes; texto explícito sobre saturação do mercado"}, {"text": "A pontuação de Singularidade & Diferenciação é 6 ou abaixo para uma ideia tão genérica", "passed": true, "evidence": "Singularidade & Diferenciação: 3/10 — nota extremamente honesta e justif
