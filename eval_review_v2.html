gista:** Validador de Ideias Literárias (Estrategista Sênior de Publicação)\n\n---\n\n## Resumo da Ideia\n\n**Ideia do Livro:** Um livro prático com hábitos e exercícios mentais para ser mais feliz  \n**Histórico do Autor:** Professor de escola pública há 15 anos, sem formação em psicologia ou coaching  \n**Leitor-Alvo:** \"Todo mundo que está triste ou insatisfeito com a vida\"  \n**Objetivo Principal:** Deixar um legado e talvez ganhar algum dinheiro\n\n---\n\n## 🎯 TESTE DE DEMANDA DE MERCADO\n\n### Há fome comprovada de leitores por este tema agora?\n\nSim — e esse é exatamente o problema.\n\nA categoria de autoajuda é uma das maiores e mais lucrativas do mercado editorial global. No Brasil, autoajuda consistentemente ocupa os topes das listas de mais vendidos da Amazon.com.br e do PublishNews. Globalmente, livros como *Hábitos Atômicos* (James Clear) venderam mais de 20 milhões de cópias. *Ikigai* é um fenômeno de 1,5 milhão de cópias só no mercado internacional. *The Happiness Advantage* (Shawn Achor) foi bestseller do New York Times.\n\nIsso significa que a demanda por felicidade existe. Mas o mercado de \"felicidade genérica\" está entre os mais saturados do planeta. Há literalmente milhares de livros disputando o mesmo leitor. A demanda existe — mas a oferta já a sufoca.\n\n### Quais lacunas existem?\n\nA pesquisa revelou padrões claros nos reviews negativos dos livros existentes:\n\n1. **Falta de contextualização cultural brasileira** — a maioria dos bestsellers vem dos EUA e pressupõe uma realidade socioeconômica muito diferente.\n2. **Autores sem credibilidade verificável** — leitores brasileiros estão cada vez mais céticos com coaches e especialistas sem história real.\n3. **Ausência de perspectiva de quem vive realidade dura** — professores de escola pública, trabalhadores de renda baixa, pessoas que não têm luxo de \"meditar 30 minutos por dia\".\n4. **Excesso de teoria, falta de prática contextualizada** — livros prometem hábitos que funcionam em ambientes ideais, não em salas de aula lotadas ou rotinas exaustivas.\n\n**Espaço em branco real:** Um livro de felicidade voltado para quem trabalha em condições adversas — como professores do serviço público — com exercícios que cabem em 5 minutos entre uma aula e outra. *Isso* não existe no mercado.\n\n---\n\n## 🔍 AFIAMENTO DO CONCEITO\n\n### A Premissa Irresistível (versão atual — PROBLEMÁTICA)\n> \"Um livro prático sobre hábitos e exercícios mentais para ser mais feliz.\"\n\nEssa premissa poderia descrever 3.000 livros já publicados. Não há nada que faça um editor se inclinar para frente.\n\n### A Transformação do Leitor (versão atual — VAGA)\nO leitor se torna... mais feliz? Isso não é uma transformação específica. Qualquer livro de autoajuda promete isso.\n\n### O Ângulo Único (versão atual — INEXISTENTE)\nNão há ângulo único identificado na proposta atual. A ideia está completamente genérica.\n\n---\n\n### Versão Afiada (o que a ideia PODERIA se tornar)\n\nSe o autor abraçar sua identidade real de professor de escola pública com 15 anos de experiência:\n\n**Premissa Irresistível:**\n> \"Um professor que passou 15 anos nas trincheiras do ensino público descobriu que a felicidade não vem de meditação de luxo ou retiros caros — ela nasce em pausas de 3 minutos entre uma aula e outra, e funciona justamente porque você está exausto, não apesar disso.\"\n\n**Transformação do Leitor:**\n> O leitor — alguém que trabalha duro, tem pouco tempo e começa a desacreditar que merece ser feliz — descobre que pode construir bem-estar real em micro-momentos do cotidiano mais difícil.\n\n**Ângulo Único:**\n> A felicidade ensinada por quem nunca teve o luxo de fazer um curso de coaching. Exercícios que funcionam com giz nas mãos, não com uma agenda de couro na mão.\n\n---\n\n## 📚 ANÁLISE DOS 10 CONCORRENTES\n\n| # | Título & Autor | Ano | Pontos Fortes | Pontos Fracos | Posição de Mercado |\n|---|----------------|-----|---------------|---------------|-------------------|\n| 1 | **Hábitos Atômicos** — James Clear | 2018 | Método claro (1%), sistema de identidade, exemplos concretos | Foco em performance/produtividade, não em bem-estar emocional; perspectiva americana | Profissionais que querem alta performance |\n| 2 | **Ikigai** — Héctor García & Francesc Miralles | 2016 | Filosofia japonesa sedutora, fácil de ler, culturalmente rico | Superficial; não dá exercícios práticos reais; promessa vaga de longevidade | Adultos urbanos curiosos por cultura japonesa |\n| 3 | **The Happiness Advantage** — Shawn Achor | 2010 | Base em pesquisa de Harvard, dados científicos, aplicável no trabalho | Voltado para ambiente corporativo; pressupõe emprego de escritório | Executivos e líderes corporativos |\n| 4 | **O Livro da Alegria** — Dalai Lama & Desmond Tutu | 2016 | Autoridade espiritual incomparável, profundo emocionalmente | Impraticável para o cotidiano; falta de exercícios concretos; linguagem distante | Adultos espiritualmente inclinados |\n| 5 | **Stumbling on Happiness** — Daniel Gilbert | 2006 | Rigor acadêmico de Harvard, desmonta mitos sobre felicidade | Descritivo, não prescritivo — explica o problema mas não resolve | Leitores acadêmicos e curiosos intelectuais |\n| 6 | **O Poder do Hábito** — Charles Duhigg | 2012 | Neurociência acessível, histórias fascinantes, framework do loop | Não trata de felicidade diretamente; mais sobre mudança comportamental | Leitores que querem entender hábitos cognitivos |\n| 7 | **A Sutil Arte de Ligar o F*da-se** — Mark Manson | 2016 | Tom irreverente, anti-positividade tóxica, honesto | Nichado para jovens adultos; cínico demais para quem busca esperança real | Millennials céticos de autoajuda |\n| 8 | **Não Faz Mal Ser Feliz** — Augusto Cury | 2018 | Autor brasileiro, linguagem acessível, base em psicologia cognitiva | Credencial médica dominante; leitores com menos escolaridade | Público religioso/espiritualizado brasileiro |\n| 9 | **Flow** — Mihaly Csikszentmihalyi | 1990 | Conceito revolucionário do \"estado de fluxo\", base científica sólida | Denso, acadêmico, difícil de aplicar na prática cotidiana | Pesquisadores, psicólogos, educadores |\n| 10 | **O Poder da Presença** — Amy Cuddy | 2015 | Base em pesquisa TED Talk, linguagem acessível, exercícios corporais | Foco em confiança/presença, não em felicidade; perspectiva americana | Profissionais que querem mais autoconfiança |\n\n### Síntese — O Padrão Que Emerge\n\nTodos os 10 livros compartilham pelo menos um destes problemas:\n\n1. **Credencial acadêmica ou espiritual alta** (Harvard, Nobel, médico) — criando barreira de entrada que um professor sem pós-graduação em psicologia não consegue superar no mesmo território genérico.\n2. **Perspectiva americana ou europeia** — nenhum deles fala da realidade de quem ganha salário de professor de escola pública no Brasil.\n3. **Exercícios para quem tem tempo** — meditação de 20 minutos, journaling diário, rotina matinal de 1 hora. Nenhum foi escrito para quem tem 40 alunos e 10 minutos de intervalo.\n\n**O espaço em branco:** Não existe nenhum livro de felicidade prática escrito da perspectiva de quem trabalha em condições adversas no Brasil, com exercícios que cabem na realidade de quem está exausto e tem pouco tempo.\n\n---\n\n## 📝 GERADOR DE TÍTULOS\n\n| # | Título | Subtítulo |\n|---|--------|-----------|\n| 1 | **O Professor da Alegria** | Como 15 anos de escola pública me ensinaram os hábitos de felicidade que nenhum livro de autoajuda sabe |\n| 2 | **Feliz no Intervalo** | 27 hábitos de bem-estar que funcionam em 5 minutos — para quem não tem mais do que isso |\n| 3 | **A Felicidade Que Eu Podia Pagar** | Exercícios mentais práticos para ser mais feliz com a vida que você já tem |\n| 4 | **Não Precisa de Retiro** | O método do professor exausto para construir alegria genuína no cotidiano mais difícil |\n| 5 | **Giz e Gratidão** | O que 15 anos ensinando em escola pública me ensinou sobre a ciência da felicidade real |\n| 6 | **3 Minutos Para Ser Feliz** | O sistema de micro-hábitos emocionais que funciona mesmo quando você está no limite |\n| 7 | **Escola de Felicidade** | Como professores — os profissionais mais exaustos do Brasil — aprenderam a ser mais felizes sem abrir mão de nada |\n| 8 | **A Felicidade Sem Coaching** | Hábitos e exercícios mentais para quem não tem dinheiro para guru, tempo para meditação, ou paciência para positividade tóxica |\n| 9 | **Sala de Aula, Alma Aberta** | O guia prático de bem-estar para educadores que precisam dar alegria antes de recebê-la |\n| 10 | **Método Intervalo** | Como transformar os 10 minutos mais improváveis do seu dia nos mais felizes da sua semana |\n\n### Recomendação de Título com Convicção\n\n**Título recomendado: \"Feliz no Intervalo\" com subtítulo \"27 hábitos de bem-estar que funcionam em 5 minutos — para quem não tem mais do que isso\"**\n\nPor quê este vence os outros:\n\n1. **\"Intervalo\" tem duplo sentido perfeito** — o intervalo escolar (âncora na identidade do autor) e o intervalo da vida corrida (universal para o leitor exausto). Isso cria uma ressonância que os outros títulos não têm.\n2. **\"5 minutos\" é uma promessa específica e verificável** — diferente de \"seja mais feliz\", que qualquer livro promete. O leitor sabe exatamente o que vai ganhar.\n3. **\"Para quem não tem mais do que isso\" é uma declaração de empatia radical** — captura imediatamente o leitor que já desistiu de livros de autoajuda por achá-los inacessíveis.\n4. O número \"27\" cria curiosidade e especificidade sem soar arbitrário como \"10 dicas\".\n\n---\n\n## 📊 PONTUAÇÃO DE PUBLICABILIDADE\n\n### Ideia como está apresentada (genérica):\n\n| Dimensão | Pontuação | Justificativa |\n|----------|-----------|---------------|\n| Demanda de Mercado | 6/10 | A demanda por felicidade existe, mas o mercado está tão saturado que um livro genérico sobre o tema se perde em ruído. Sem diferenciação, a demanda não se converte em vendas. |\n| Singularidade & Diferenciação | **3/10** | \"Hábitos e exercícios mentais para ser mais feliz\" descreve literalmente milhares de livros já publicados. Não há ângulo único identificado. O leitor-alvo \"todo mundo que está triste\" é impossível de alcançar com marketing. Esta é a nota mais preocupante. |\n| Credibilidade do Autor | 4/10 | Sem formação em psicologia, coaching ou medicina, e com o tema apresentado de forma genérica, o autor não tem autoridade para escrever \"mais um livro de felicidade\". O mercado vai perguntar: \"por que devo ouvir este professor em vez de um psicólogo de Harvard?\" — e a resposta atual é: não há motivo. |\n\n**Nota média: 4,3/10**\n\n---\n\n## ⚠️ VEREDICTO: CONCEITO PRECISA DE TRABALHO\n\nTrês dimensões abaixo de 7. **Não escreva este livro como está concebido.**\n\nNão é uma questão de talento — é uma questão de posicionamento. A ideia genérica de \"livro sobre felicidade\" não vai funcionar independente de quão bem escrito seja. O problema não é você. O problema é que você ainda não encontrou o seu livro dentro do tema felicidade.\n\n---\n\n## Como Avançar — Próximos 7 Dias\n\n### O problema central\n\nVocê tem um ativo extremamente valioso que está escondendo: **15 anos de sala de aula em escola pública**.\n\nIsso é uma credencial que nenhum autor de livro de felicidade no mercado tem. Shawn Achor foi para Harvard. O Dalai Lama é um líder espiritual. Você esteve nas trincheiras com 40 adolescentes num calor de 35 graus sem ar condicionado. Essa experiência é irreproduzível.\n\n### O que fazer nos próximos 7 dias:\n\n**Dia 1-2:** Responda honestamente a estas três perguntas por escrito:\n- Qual foi o momento mais difícil da sua carreira como professor em que você escolheu a alegria em vez do desespero? O que você fez concretamente?\n- Quais hábitos você desenvolveu especificamente *por causa* das condições adversas do ensino público — não apesar delas?\n- Qual professor colega seu é visivelmente mais feliz do que os outros? O que ele faz diferente?\n\n**Dia 3-4:** Redefina seu leitor-alvo. Não é \"todo mundo triste\". É: **\"O professor de escola pública que está no 10º ano de carreira e começa a sentir que a alegria foi embora junto com a idealização.\"** Ou: **\"O trabalhador de serviço público que quer ser feliz mas sente que os livros de autoajuda foram escritos para outra classe social.\"**\n\n**Dia 5-7:** Escreva uma premissa de uma frase que só você — professor de escola pública há 15 anos — poderia escrever. Se qualquer outro autor pudesse escrever a mesma premissa, você ainda não encontrou seu livro.\n\n### A pergunta decisiva\n\nSe você nichar o livro para professores e servidores públicos, a nota de Singularidade sobe para 8/10 e a Credibilidade para 7/10. O livro se torna publicável.\n\nSe mantiver \"todo mundo que está triste\", o livro compete contra Dalai Lama, Harvard e James Clear — e perde.\n\n**A escolha é sua. Mas a recomendação é clara: nichar é a única saída.**\n\n---\n\n*Análise gerada pelo Validador de Ideias Literárias — Estrategista Sênior de Publicação*  \n*Data: 15 de maio de 2026*\n"}]}, "without_skill": {"config": "without_skill", "prompt": "Tenho uma ideia meio vaga ainda... quero escrever algo sobre felicidade. Tipo, um livro que ajude as pessoas a serem mais felizes no dia a dia. Acho que todo mundo precisa disso né?", "grading": {"run_id": "eval-2-felicidade-without_skill", "expectations": [{"text": "A skill faz as 4 perguntas de coleta pois a ideia é vaga e faltam informações cruciais", "passed": false, "evidence": "Sem skill, não há protocolo de coleta ativa das 4 informações obrigatórias antes de prosseguir"}, {"text": "A skill NÃO entrega análise completa antes de receber as informações do usuário", "passed": false, "evidence": "Sem skill, análise é entregue sem coleta estruturada das informações do autor"}, {"text": "Quando analisa, identifica que 'felicidade' é um mercado extremamente saturado e competitivo", "passed": true, "evidence": "Identifica saturação do mercado de autoajuda como problema central"}, {"text": "A pontuação de Singularidade & Diferenciação é 6 ou abaixo para uma ideia tão genérica", "passed": false, "evidence": "Sem skill, não há scorecard numérico — apenas narrativa qualitativa '5/10 no geral' sem dimensões separadas"}, {"text": "O veredicto final é PRECISA DE TRABALHO ou equivalente, não APROVADO", "passed": true, "evidence": "Sem skill, a conclusão também reconhece que a ideia precisa refinamento (viabilidade 5/10)"}, {"text": "Entrega um próximo passo concreto (não genérico) para afinar o conceito", "passed": true, "evidence": "Sugere focar em perspectiva de professor de escola pública — mesmo insight que a skill"}], "pass_rate": 0.5, "notes": "Sem skill, sem coleta estruturada, sem scorecard por dimensão, sem tabela de concorrentes, sem mapa de posicionamento. Acerta a direção geral mas perde o rigor do processo."}, "files": [{"name": "analysis.md", "type": "md", "content": "# Validacao da Ideia de Livro: Felicidade no Dia a Dia\n\n**Data da analise:** 15 de maio de 2026\n**Autor:** Professor de escola publica, 15 anos de experiencia\n\n---\n\n## Resumo da Ideia\n\nVoce quer escrever um livro pratico com habitos e exercicios mentais para ajudar pessoas a serem mais felizes no cotidiano. Seu perfil: professor de escola publica ha 15 anos, sem formacao em psicologia. Publico-alvo declarado: \"todo mundo que esta triste ou insatisfeito\". Objetivos: deixar um legado e possivelmente gerar renda.\n\n---\n\n## 1. Analise do Mercado\n\n### O tema tem demanda?\n\nSim, e bastante alta. Livros sobre felicidade, bem-estar e habitos positivos estao entre os mais vendidos globalmente ha decadas. No Brasil, titulos como \"O Poder do Habito\" (Charles Duhigg), \"Essencialismo\" (Greg McKeown), \"A Coragem de Ser Imperfeito\" (Brene Brown) e obras da psicologia positiva vendem consistentemente bem.\n\n**Pontos favoraveis do mercado:**\n- O tema de autoajuda e bem-estar psicologico nunca sai de moda\n- Pos-pandemia, houve aumento significativo no interesse por saude mental e qualidade de vida\n- Leitores brasileiros consomem muito conteudo sobre desenvolvimento pessoal\n- O formato \"pratico com exercicios\" e muito apreciado (facilita a acao concreta)\n\n**Ponto de atencao critico:**\nO mercado e altamente saturado. Existem centenas de livros sobre felicidade e habitos. Titulos classicos como os de Martin Seligman (pai da Psicologia Positiva), Gretchen Rubin, James Clear e muitos outros ja ocupam esse espaco. Para ter sucesso, voce precisara de um angulo diferenciador claro.\n\n---\n\n## 2. Analise do Publico-Alvo\n\n### \"Todo mundo que esta triste ou insatisfeito\" - isso funciona?\n\n**Nao funciona bem como definicao de publico-alvo.** Esse e um dos maiores riscos da sua ideia no formato atual.\n\nQuando um livro e \"para todo mundo\", ele acaba nao sendo para ninguem em especial. Editoras, livreiros e leitores precisam saber com precisao a quem o livro se destina. A mensagem, os exemplos, o tom e os exercicios precisam ressoar com uma pessoa especifica - nao com uma audiencia abstrata e universal.\n\n**Perguntas que ajudam a afinar o publico:**\n- Sao adultos jovens (20-35 anos) sobrecarregados no trabalho?\n- Sao pais e maes que perderam o senso de identidade pessoal?\n- Sao pessoas na meia-idade em transicao de carreira?\n- Sao professores esgotados (um publico que voce conhece intimamente)?\n- Sao pessoas em situacao de vulnerabilidade social?\n\n**Sugestao estrategica:** Dado o seu historico de 15 anos como professor de escola publica, voce tem acesso a um publico que pouquissimos autores de autoajuda conseguem alcançar com autenticidade: educadores, trabalhadores de servicos publicos, pessoas de classe media e baixa que raramente se veem representadas nos livros de desenvolvimento pessoal cheios de exemplos de CEOs e empreendedores de sucesso. Isso e um diferencial real e valioso.\n\n---\n\n## 3. Analise da Proposta de Valor e Diferenciacao\n\n### O que tornaria seu livro unico?\n\nEsta e a pergunta mais importante e, no momento, a sua ideia ainda nao tem uma resposta clara. \"Habitos e exercicios mentais para ser mais feliz\" descreve dezenas de livros ja publicados.\n\n**Diferenciais possiveis que voce poderia explorar:**\n\n1. **A perspectiva do professor:** Voce passou 15 anos observando o desenvolvimento humano, motivacao, fracasso e resiliencia em sala de aula. Voce conhece a felicidade (e a infelicidade) de pessoas reais, nao de casos de estudo de Harvard. Isso e materia-prima valiosa e autentica.\n\n2. **O contexto brasileiro e de escola publica:** A maioria dos livros de autoajuda e traduzida do ingles e cheia de referencias culturais americanas ou europeias. Um livro enraizado na realidade brasileira tem potencial de criar conexao profunda com leitores nacionais.\n\n3. **Felicidade acessivel para quem nao tem tempo nem dinheiro:** Muitos livros de bem-estar pressupõem que o leitor tem tempo para meditar 30 minutos por dia, acesso a academia e dinheiro para terapia. Voce pode escrever para quem nao tem nada disso.\n\n4. **Exercicios baseados em contexto de sala de aula:** A pedagogia e uma ciencia do comportamento e da motivacao humana. Voce pode traduzir tecnicas pedagogicas eficazes em praticas de autodesenvolvimento - com uma credibilidade diferente de um coach ou terapeuta.\n\n---\n\n## 4. Analise da Credibilidade do Autor\n\n### \"Sem formacao em psicologia\" e um problema?\n\nE um desafio, nao necessariamente um impeditivo - mas precisa ser endereçado com honestidade e estrategia.\n\n**O que joga a favor:**\n- Professores sao especialistas em comportamento humano, aprendizagem e desenvolvimento\n- Sua experiencia pratica de 15 anos e uma forma de credibilidade empirica e autentica\n- Leitores de autoajuda frequentemente se identificam mais com autores \"comuns\" do que com academicos distantes\n- Muitos autores de sucesso no genero nao sao psicologos (ex.: Mark Manson, James Clear)\n\n**O que joga contra:**\n- Sem embasamento cientifico explicito, o livro pode ser visto como \"opiniao pessoal\"\n- Voce pode fazer afirmacoes sobre saude mental que precisariam de ressalvas importantes\n- Editoras mais rigidas podem pedir revisao tecnica de um profissional de saude mental\n\n**Recomendacoes praticas:**\n- Baseie os exercicios em pesquisas citadas (psicologia positiva, neurociencia do comportamento) - voce nao precisa ser o pesquisador, precisa ser um bom curador e comunicador\n- Seja transparente sobre seu perfil no livro: \"Sou professor, nao psicologo. O que compartilho aqui vem de 15 anos observando pessoas reais...\"\n- Considere ter uma revisao tecnica de um psicologo ou pesquisador\n- Evite linguagem clinica ou diagnostica (nao tente \"tratar\" depressao ou ansiedade)\n\n---\n\n## 5. Analise dos Objetivos\n\n### \"Deixar um legado e talvez ganhar algum dinheiro\"\n\n**Sobre o legado:**\nEste e um objetivo nobre e absolutamente realizavel. Um livro bem escrito que genuinamente ajuda pessoas cria um legado duradouro. Este objetivo esta bem alinhado com a ideia.\n\n**Sobre ganhar dinheiro:**\nAqui e necessario ser honesto e realista:\n\n- A grande maioria dos livros publicados no Brasil nao gera renda significativa para o autor\n- Um primeiro livro de autor desconhecido raramente vende mais de 1.000 a 3.000 copias\n- Royalties de editoras tradicionais giram em torno de 8% a 15% do preco de capa\n- Se o livro custar R$50 e vender 2.000 copias, voce receberia entre R$8.000 e R$15.000 - antes do imposto de renda\n\n**Estrategias para aumentar o potencial de renda:**\n- Autopublicacao (Amazon KDP) permite royalties de 35% a 70%, mas exige marketing proprio\n- O livro pode ser uma porta de entrada para palestras, cursos e workshops - onde esta o dinheiro real\n- Construir audiencia nas redes sociais antes de publicar aumenta muito as chances de vendas\n- Parcerias com sindicatos de professores, secretarias de educacao e ONGs podem gerar vendas em lote\n\n---\n\n## 6. Pontos Fortes da Ideia\n\n1. **Tema com demanda comprovada e perene** - felicidade sempre sera relevante\n2. **Formato pratico** (habitos + exercicios) e o preferido pelos leitores de autoajuda\n3. **Autor com experiencia humana rica e autentica** - 15 anos de escola publica e um laboratorio de vida real\n4. **Potencial de representatividade** - livros que falam para o Brasil real ainda sao poucos\n5. **Motivacao genuina** - querer deixar um legado e uma motivacao sustentavel para completar um projeto longo\n\n---\n\n## 7. Riscos e Pontos Frageis\n\n1. **Saturacao do mercado** - o genero e muito concorrido; sem diferenciacao clara, o livro se perde\n2. **Publico-alvo vago** - \"todo mundo\" nao e uma estrategia editorial viavel\n3. **Ausencia de plataforma** - sem audiencia previa, o lancamento e muito mais dificil\n4. **Risco de generismo** - exercicios e conselhos que ja aparecem em dezenas de outros livros sem angulo proprio\n5. **Questoes de responsabilidade** - escrever sobre saude mental sem formacao exige cuidado para nao ultrapassar limites eticos\n\n---\n\n## 8. Recomendacoes para Fortalecer a Ideia\n\n**Passo 1 - Afinar o publico-alvo**\nEscolha uma pessoa especifica. Exemplo: \"Professores e trabalhadores de servicos publicos entre 30 e 50 anos que se sentem esgotados e esquecidos pelo sistema.\" Quanto mais especifico, mais poderoso o livro.\n\n**Passo 2 - Encontrar o angulo unico**\nComplete esta frase: \"Este livro e diferente porque _____.\" Se voce nao consegue completar, a ideia ainda precisa amadurecer. Sugestao baseada no seu perfil: \"Este livro foi escrito por quem nao veio de Harvard nem tem consultorio proprio - mas passou 15 anos na trincheira da educacao publica, vendo de perto o que faz pessoas comuns encontrarem alegria em condicoes dificeis.\"\n\n**Passo 3 - Validar com leitores reais**\nAntes de escrever o livro inteiro, escreva 2 ou 3 capitulos e compartilhe com pessoas do seu perfil de leitor ideal. Essa validacao vale mais do que qualquer analise de mercado.\n\n**Passo 4 - Construir plataforma paralela**\nComece a escrever sobre o tema nas redes sociais ou crie um blog. Isso serve para: (a) desenvolver sua voz de escritor, (b) construir audiencia antes do lancamento, (c) testar quais conteudos ressoam mais.\n\n**Passo 5 - Decidir o caminho editorial**\n- **Editora tradicional:** maior legitimidade, sem custo de producao, mas processo pode levar anos\n- **Autopublicacao:** mais rapido, maior controle, royalties maiores, mas voce arca com custos de producao e marketing\n\n---\n\n## 9. Veredicto Final\n\n### A ideia tem potencial? SIM, com ressalvas importantes.\n\nO tema e valido. Voce tem uma historia de vida e perspectiva genuinas que podem gerar um livro autentico e relevante. Mas no formato atual - \"um livro sobre felicidade para todo mundo\" - a ideia e generica demais para se destacar em um mercado lotado.\n\n**O que faria essa ideia se tornar um projeto editorial solido:**\n- Um publico-alvo especifico e bem definido\n- Um angulo diferenciador claro (idealmente ancorado na sua experiencia como professor)\n- Um titulo e subtitulo que comuniquem imediatamente o valor unico do livro\n- Uma plataforma minima de audiencia antes do lancamento\n\n**Escala de viabilidade atual:** 5/10\n**Escala de viabilidade com ajustes sugeridos:** 8/10\n\nA materia-prima esta ali. O que falta e refinamento estrategico - e isso e inteiramente possivel antes de escrever a primeira pagina.\n\n---\n\n## Proximos Passos Sugeridos\n\n1. Responder por escrito: \"Para quem exatamente este livro e? Descreva essa pessoa em detalhes.\"\n2. Pesquisar os 5 livros mais vendidos sobre felicidade/habitos no Brasil hoje e identificar o que cada um faz - e o que nenhum deles faz\n3. Escrever o primeiro capitulo como exercicio, sem comprometimento, apenas para encontrar sua voz\n4. Conversar com 10 pessoas do seu publico-alvo ideal: \"Que livro sobre felicidade voce gostaria de ler que ainda nao existe?\"\n5. Criar um perfil nas redes sociais ou escrever uma newsletter por 30 dias sobre o tema para testar receptividade\n\n---\n\n*Esta analise foi elaborada com base nas informacoes fornecidas sobre a ideia, o perfil do autor e os objetivos declarados.*\n"}]}}, {"id": "eval-3-bienestar-es", "label": "🇪🇸 Bienestar Latinas (ES) — Coleta Parcial", "with_skill": {"config": "with_skill", "prompt": "Quiero escribir un libro sobre bienestar para mamás latinoamericanas que viven en Estados Unidos. Soy psicóloga clínica con 8 años de experiencia trabajando con esta comunidad.", "grading": {"run_id": "eval-3-bienestar-es-with_skill", "expectations": [{"text": "Toda la respuesta es en español, adaptándose al idioma del usuario", "passed": true, "evidence": "La skill detectó que el usuario escribió en español y toda la interacción simulada — desde la solicitud de información faltante, hasta el análisis completo, los títulos, el scorecard y los próximos pasos — está íntegramente en español. Los documentos (analysis.md y Validacion_Bienestar.docx) también están en español."}, {"text": "La skill pide las informaciones que faltan antes de continuar", "passed": true, "evidence": "La skill identificó correctamente que el mensaje inicial tenía 2 de los 4 datos requeridos (idea del libro ✅ e historial del autor ✅) pero faltaban el lector-objetivo y el objetivo principal. La skill formuló una solicitud específica y amigable pidiendo exactamente esos dos datos antes de proceder con cualquier análisis."}, {"text": "La skill NO entrega análisis completo antes de recibir las informaciones del usuario", "passed": true, "evidence": "La primera respuesta simulada de la skill contiene exclusivamente las preguntas sobre los datos faltantes (lector ideal y objetivo), sin ningún elemento de análisis, tabla de competidores, títulos ni puntuación. El análisis completo solo aparece después de la respuesta del usuario con las dos informaciones solicitadas."}, {"text": "Cuando analiza, menciona títulos reales de libros sobre bienestar/salud mental latina con autores reales", "passed" EQARAGEEAADinQAAAAA="}, {"name": "analysis.md", "type": "md", "content": "# Validación de Idea Editorial — Estrategista Sénior de Publicación\n\n---\n\n## SIMULACIÓN DE INTERACCIÓN CON LA SKILL\n\n### Mensaje inicial del usuario:\n> \"Quiero escribir un libro sobre bienestar para mamás latinoamericanas que viven en Estados Unidos. Soy psicóloga clínica con 8 años de experiencia trabajando con esta comunidad.\"\n\n---\n\n### ETAPA 1 — Respuesta de la skill (pidiendo información faltante)\n\nLa skill detecta que el usuario ya proporcionó:\n- ✅ Idea del libro: bienestar para mamás latinoamericanas en EE.UU.\n- ✅ Historial del autor: psicóloga clínica con 8 años de experiencia con esta comunidad\n\nPero FALTA:\n- ❌ Lector objetivo (detalles específicos)\n- ❌ Objetivo principal del libro\n\n**Respuesta de la skill:**\n\n> ¡Qué premisa tan poderosa! Tu combinación de experiencia clínica real con esta comunidad ya te coloca en una posición privilegiada frente al mercado. Antes de hacer el análisis completo, necesito dos datos más:\n>\n> **1. ¿Quién es exactamente tu lectora ideal?**\n> Ve más allá de \"mamá latina en EE.UU.\" — ¿qué edad? ¿primera o segunda generación? ¿qué problema específico la mantiene despierta a las 2am? ¿qué siente que no encuentra en los libros de bienestar disponibles?\n>\n> **2. ¿Qué quieres que este libro logre para TI?**\n> ¿Ingresos pasivos? ¿Construir autoridad para conferencias y talleres? ¿Impacto social en la comunidad? ¿Las tres cosas? Saber tu objetivo cambia completamente cómo posicionamos el libro.\n\n---\n\n### Respuesta del usuario:\n> \"Mi lector ideal es una mamá latina de 28-45 años, primera o segunda generación, que lucha con el agotamiento, la culpa materna y la pérdida de identidad. Mi objetivo es construir autoridad y eventualmente dar talleres y conferencias.\"\n\n---\n\n## ETAPA 2 — ANÁLISIS COMPLETO\n\n*(Basado en investigación web real realizada con 4+ búsquedas)*\n\n---\n\n## 🎯 PRUEBA DE DEMANDA DE MERCADO\n\n### ¿Hay demanda real?\n\n**Sí — y está documentada.** Los datos apuntan a un nicho específico con demanda creciente y oferta insuficiente:\n\n- HipLatina, Latinx Therapy y Therapy for Latinx publican regularmente contenido sobre agotamiento materno en inmigrantes latinas, con alto engagement, señalando que el público busca recursos específicos para su identidad cultural.\n- Un estudio de 2023 en el *Journal of Social Issues* documentó las cargas particulares de las madres latinas inmigrantes durante el COVID, con hallazgos sobre doble jornada, aislamiento y culpa materna — exactamente los temas de este libro.\n- Un estudio de 2024 en SAGE (*The Maternal Guilt of Working Latina Mothers*) confirma que \"hay una falta de investigación\" sobre este tema — lo que significa que tampoco hay libros que llenen ese vacío.\n- El segmento \"Latina wellness\" en Amazon/Goodreads muestra títulos que se enfocan en Latinas en general, no en **madres** específicamente.\n\n### ¿Qué libros dominan el espacio?\n\nLos libros existentes fallan en uno de tres puntos:\n1. Hablan de Latinas, pero no de **madres** Latinas\n2. Hablan de madres, pero no de la experiencia **cultural bicultural/inmigrante**\n3. Hablan de bienestar, pero desde una perspectiva **general/no clínica**\n\n**La brecha de mercado es clara:** no existe un libro escrito por una psicóloga clínica que combine bienestar, maternidad latina, experiencia inmigrante/bicultural, agotamiento y pérdida de identidad en un solo volumen en inglés ni en español orientado al mercado estadounidense.\n\n---\n\n## 🔍 AFINAMIENTO DEL CONCEPTO\n\n### La Premisa Irresistible\n*\"Una psicóloga clínica con 8 años trabajando exclusivamente con madres latinas en EE.UU. revela por qué el bienestar convencional no funciona para ellas — y ofrece el primer mapa de recuperación que honra quiénes realmente son.\"*\n\n### La Transformación del Lector\nLa lectora entra al libro sintiéndose fracasada como madre, como mujer y como inmigrante. Sale entendiendo que su agotamiento no es una falla personal sino el resultado predecible de cargar expectativas culturales en conflicto — y con herramientas clínicas reales para recuperar su identidad sin abandonar sus raíces.\n\n### El Ángulo Único\nNingún libro existente combina los tres pilares:\n1. **Especificidad cultural** (no \"bienestar para mujeres\" sino para madres latinas de 1ª/2ª generación en EE.UU.)\n2. **Autoridad clínica** (no influencer de wellness, sino psicóloga con casos reales)\n3. **Los tres dolores simultáneos**: agotamiento + culpa materna + pérdida de identidad — tratados como un sistema, no por separado\n\n---\n\n## 📚 ANÁLISIS DE LOS 10 COMPETIDORES REALES\n\n| # | Título & Autor | Año | Puntos Fuertes | Puntos Débiles | Posición |\n|---|----------------|-----|----------------|----------------|----------|\n| 1 | **Self-Care for Latinas** — Raquel Reichard | 2023 | 1. Específico para Latinas. 2. 100+ ejercicios prácticos. 3. Tono celebratorio e inclusivo. | 1. No está enfocado en madres. 2. Autora es periodista, no clínica. 3. Aborda bienestar superficialmente (actividades, no trauma sistémico). | Latinas jóvenes en general, tono pop/lifestyle |\n| 2 | **I Am Diosa** — Christine Gutierrez | 2019 | 1. Voz íntima y auténtica. 2. Combina espiritualidad con psicología. 3. Muy reseñado y querido. | 1. Enfocado en sanación de trauma romántico, no materno. 2. Sin perspectiva inmigrante específica. 3. No aborda agotamiento ni culpa maternal. | Latinas sanando relaciones/autoestima |\n| 3 | **Break the Cycle** — Dra. Mariel Buqué | 2023 | 1. Autora es psicóloga clínica. 2. Basa en ciencia del trauma intergeneracional. 3. Gran visibilidad mediática. | 1. Mercado general, no específico a Latinas o madres. 2. No aborda identidad bicultural. 3. Falta de herramientas adaptadas culturalmente. | Mercado general de trauma intergeneracional |\n| 4 | **Uncolonized Latinas** — Valeria Aloe | 2022 | 1. Aborda identidad y descolonización. 2. Fuerte desde perspectiva inmigrante. 3. Comunidad activa. | 1. No tiene base clínica. 2. No está enfocado en madres. 3. Tono académico puede alienar. | Latinas interesadas en identidad y descolonización |\n| 5 | **Latina/o American Health and Mental Health** — Dra. Leticia Arellano-Morales | 2019 | 1. Rigor académico. 2. Cubre salud mental y física. 3. Útil para profesionales. | 1. Académico, no accesible al público general. 2. Sin ejercicios ni herramientas prácticas. 3. No enfocado en madres. | Profesionales de salud mental y académicos |\n| 6 | **The Four Agreements** — Don Miguel Ruiz | 1997 | 1. Filosofía accesible. 2. Raíces culturales mesoamericanas. 3. Bestseller global. | 1. No está dirigido a Latinas específicamente. 2. Sin perspectiva clínica. 3. No aborda experiencia materna ni inmigración. | Mercado espiritual/autoayuda general |\n| 7 | **Mother Island** — Jamie Figueroa | 2024 | 1. Memoir emotivo sobre identidad latina. 2. Perspectiva bicultural auténtica. 3. Voz literaria poderosa. | 1. Memoir narrativo, no libro de herramientas. 2. No es aplicable directamente. 3. No es no-ficción práctica. | Lectoras de memoir literario latino |\n| 8 | **Reclaiming Postpartum Wellness** — Maranda Bower | 2022 | 1. Enfocado en bienestar posparto. 2. Perspectiva holística. 3. Cubre identidad materna. | 1. Sin perspectiva cultural latina. 2. Solo cubre el período posparto, no maternidad continua. 3. Autora no tiene credenciales clínicas. | Madres en general en etapa posparto |\n| 9 | **Terapia para Llevar** — Ana Pérez (psicóloga) | 2021 | 1. Base clínica en psicología. 2. 100+ herramientas prácticas. 3. Accesible. | 1. Mercado español, no latino en EE.UU. 2. Sin perspectiva cultural de inmigración. 3. No aborda maternidad. | Lectores hispanohablantes de España/LATAM |\n| 10 | **12 Ways to Cope With Your Latina Mom** — Jasmine Cepeda | 2020 | 1. Específico sobre dinámicas materno-filiales latinas. 2. Ejercicios de límites y autocompasión. 3. Perspectiva cultural auténtica. | 1. Perspectiva del hijo/a, no de la madre. 2. Enfocado en relación madre-hijo, no bienestar materno. 3. Alcance limitado. | Hijos adultos de madres latinas |\n\n### Síntesis del Paisaje Competitivo\n\nEl patrón que emerge es claro: **los libros eligen entre autenticidad cultural O credibilidad clínica O enfoque en madres — ninguno tiene los tres.** Raquel Reichard tiene la voz latina pero no la credibilidad clínica ni el enfoque materno. Mariel Buqué tiene la credibilidad clínica pero no la especificidad cultural. Christine Gutierrez tiene la autenticidad emocional pero no el enfoque en madres ni en inmigración.\n\n**El espacio en blanco es evidente:** una psicóloga clínica, con casos reales, que entiende desde adentro la experiencia bicultural de ser madre latina en EE.UU., dirigiéndose directamente a esa mujer de 28-45 años que se siente sola en un país que no entiende su tipo particular de agotamiento.\n\n---\n\n## 🗺️ MAPA DE POSICIONAMIENTO\n\n*(Ver archivo: Mapa_Posicionamiento_Bienestar.html)*\n\n**Ejes elegidos:**\n- **Eje X:** Enfoque Cultural (General/Universal ↔ Específico Latino/Inmigrante)\n- **Eje Y:** Aproximación (Solo Inspiracional ↔ Clínico/Herramientas)\n\nLa posición recomendada para el libro de la autora: **Alta especificidad cultural + Alta credibilidad clínica** — un cuadrante actualmente vacío en el mercado.\n\n---\n\n## 📝 OPCIONES DE TÍTULO (10)\n\n| # | Título | Subtítulo |\n|---|--------|-----------|\n| 1 | **La Mamá Suficiente** | Cómo las madres latinas pueden soltar la culpa, recuperar su identidad y cuidarse sin traicionar sus raíces |\n| 2 | **El Agotamiento No Es Tu Cultura** | Guía clínica de bienestar para mamás latinoamericanas que viven entre dos mundos |\n| 3 | **Primero Yo: El Método** | 8 pasos basados en psicología clínica para que las mamás latinas en EE.UU. se recuperen del burnout sin perder quiénes son |\n| 4 | **Mamá Entera** | Cómo sanar el agotamiento, la culpa y la pérdida de identidad siendo madre latina en Estados Unidos |\n| 5 | **No Tengo Que Sacrificarme Para Ser Buena Madre** | La guía de bienestar psicológico que nadie escribió para las mamás latinas en América |\n| 6 | **Entre Dos Mundos y Sintiéndome Sola** | Bienestar real para mamás latinas que cargan con más de lo que cualquier libro de autoayuda entiende |\n| 7 | **La Psicóloga Que Trabaja Con Tu Comunidad Finalmente Lo Dice** | Lo que 8 años de sesiones con mamás latinas me enseñaron sobre el burnout, la culpa y quién eres más allá de ser madre |\n| 8 | **Sanar Sin Perderme** | El primer programa clínico de bienestar diseñado específicamente para mamás latinoamericanas en Estados Unidos |\n| 9 | **Eres Más Que Tu Sacrificio** | Guía de recuperación emocional para madres latinas que olvidaron quiénes eran antes de tener hijos |\n| 10 | **Bienestar Con Raíces** | Cómo las mamás latinas en EE.UU. pueden prosperar emocionalmente sin renunciar a su cultura ni a sí mismas |\n\n### Recomendación con Convicción\n\n**El título más fuerte es el #4: \"Mamá Entera\"** con el subtítulo revisado: *Cómo sanar el agotamiento, la culpa materna y la pérdida de identidad siendo madre latina en Estados Unidos.*\n\n**Por qué:** \"Mamá Entera\" funciona por tres razones simultáneas. (1) \"Entera\" toca directamente la herida de la lectora ideal — ella no se siente entera, se siente fragmentada entre culturas, roles y expectativas. (2) Es bilingüe en espíritu: suena igual de bien en inglés (*\"Whole Mother\"*) si se quiere publicar en ambos mercados. (3) El subtítulo nombra los tres dolores exactos del lector objetivo — agotamiento, culpa, pérdida de identidad — lo que hace que la lectora sienta que por fin alguien la vio.\n\nEl #1 (\"La Mamá Suficiente\") es el segundo más fuerte por la conexión con el concepto clínico de Winnicott de \"good enough mother\", aunque requiere que la lectora conozca ese marco teórico.\n\n---\n\n## 📊 PUNTUACIÓN DE PUBLICABILIDAD\n\n| Dimensión | Puntuación | Justificativa |\n|-----------|-----------|---------------|\n| **Demanda de Mercado** | 8/10 | El nicho de mamás latinas en EE.UU. es específico y documentado por investigación académica reciente (2023-2024). HipLatina, Latinx Therapy y medios especializados confirman demanda sin oferta suficiente. Se resta 2 puntos porque el mercado hispanohablante en EE.UU. todavía enfrenta barreras de distribución editorial y la autora deberá definir si publica en inglés, español o bilingüe — decisión que afecta el alcance significativamente. |\n| **Singularidad & Diferenciación** | 9/10 | No existe ningún libro que combine los tres pilares: psicóloga clínica + madres latinas en EE.UU. + los tres dolores específicos (agotamiento/culpa/identidad). La combinación es genuinamente única. Se resta 1 punto porque el espacio de \"bienestar para Latinas\" está creciendo rápidamente y la ventana de primer movimiento se cierra. |\n| **Credibilidad del Autor** | 8/10 | 8 años de experiencia clínica trabajando *específicamente* con esta comunidad es exactamente el tipo de credencial que los editores y lectores buscan. No es teórica — es alguien que conoce los casos reales. Se resta 2 puntos porque no se mencionó plataforma existente (redes sociales, podcast, newsletter) ni publicaciones académicas previas, que son elementos que los editores comerciales pedirán en la propuesta. |\n\n---\n\n## ✅ VEREDICTO: CONCEPTO APROBADO\n\nLas tres dimensiones superan 7/10. Este concepto tiene potencial real de publicación comercial.\n\n**Próximo paso específico para los próximos 7 días:**\n\nEscribe una \"propuesta de una página\" con estos cuatro elementos:\n1. La premisa irresistible (de esta validación)\n2. El lector específico con sus tres dolores nombrados\n3. Los 3 libros competidores más cercanos y por qué este es diferente\n4. Tu plataforma actual: ¿cuántos pacientes has atendido? ¿tienes newsletter, Instagram, presencia online?\n\nEsto servirá como el núcleo de una propuesta editorial completa. Sin plataforma digital, incluso un concepto brillante necesita más trabajo antes de ir a agentes. Comienza a construir presencia online *simultáneamente* — no esperes a tener el libro terminado.\n\n---\n\n*Análisis generado por Validador de Ideias Literárias — Estrategista Sénior de Publicación*\n*Fecha: 15 de mayo de 2026*\n"}]}, "without_skill": {"config": "without_skill", "prompt": "Quiero escribir un libro sobre bienestar para mamás latinoamericanas que viven en Estados Unidos. Soy psicóloga clínica con 8 años de experiencia trabajando con esta comunidad.", "grading": {"run_id": "eval-3-bienestar-es-without_skill", "expectations": [{"text": "Toda la respuesta es en español, adaptándose al idioma del usuario", "passed": true, "evidence": "La respuesta completa está escrita en español, incluyendo encabezados, análisis de mercado, preguntas y recomendaciones. El asistente genérico detectó correctamente el idioma del prompt y respondió en el mismo idioma."}, {"text": "La skill pide las informaciones que faltan antes de continuar", "passed": false, "evidence": "El asistente genérico NO pidió información antes de continuar. En cambio, entregó un análisis amplio de inmediato y solo al final incluyó una sección de 'Preguntas que necesito hacerte para ayudarte mejor'. El orden fue: análisis primero, preguntas después — al contrario de lo que requiere la expectativa."}, {"text": "La skill NO entrega análisis completo antes de recibir las informaciones del usuario", "passed": false, "evidence": "El asistente genérico entregó un análisis extenso sin solicitar información previa: identificó brechas de mercado, listó competidores, analizó el perfil del usuario, describió el potencial del nicho y propuso próximos pasos — todo antes de recibir cualquier respuesta del usuario. Las preguntas llegaron al final, no al principio."}, {"text": "Cuando analiza, menciona títulos reales de libros sobre bienestar/salud mental latina con autores reales", "passed": true, "evidence": "La respuesta menciona: 'Self-Care for Latinas' de Raquel Reichard (Adams Media/Simon & Schuster); 'Latina/o American Health and Mental Health' de Leticia Arellano-Morales, Ph.D.; '12 Ways to Cope With Your Latina Mom' de Jasmine Cepeda. Los tres son títulos reales con autores reales, verificados via búsqueda web."}, {"text": "Reconoce que el nicho 'mamás latinas en EEUU' es específico y valioso, no lo trata como genérico", "passed": true, "evidence": "La respuesta dedica una sección completa a explicar por qué el nicho es específico y valioso: aculturación, maternidad en aislamiento (lejos de la red familiar extendida), doble carga invisible, estigma cultural hacia la terapia, tensión de identidad. Además señala explícitamente que ningún libro existente ocupa exactamente ese espacio: psicóloga clínica + mamás latinas en EE.UU. + perspectiva clínica accesible."}, {"text": "La puntuación de Credibilidad es 7/10 o más, dado que tiene 8 años de experiencia clínica real", "passed": false, "evidence": "El asistente genérico no generó ninguna puntuación numérica de credibilidad. Sí reconoció cualitativamente la fortaleza de los 8 años de experiencia clínica ('credencial extraordinaria', 'categoría muy escasa'), pero no aplicó ningún framework de puntuación estructurado. La expectativa requiere una puntuación explícita de Credibilidad ≥ 7/10, que no fue entregada."}], "pass_rate": 0.5, "notes": "El asistente genérico pasó 3 de 6 expectativas. Puntos fuertes: respondió completamente en español, citó libros reales con autores reales, y reconoció la especificidad y valor del nicho. Puntos débiles críticos: (1) entregó análisis completo antes de pedir información al usuario — el orden fue análisis→preguntas en lugar de preguntas→análisis; (2) no generó puntuación estructurada de Credibilidad. Estos fallos son característicos del comportamiento genérico: el asistente tiende a ser inmediatamente útil y comprehensivo, sin aplicar un protocolo de recolección de datos previo al análisis. La skill estructurada debería invertir este orden: primero recopilar información clave, luego analizar."}, "files": [{"name": "analysis.md", "type": "md", "content": "# Análisis: Libro sobre Bienestar para Mamás Latinoamericanas en EE.UU.\n\n> **Respuesta generada por asistente genérico (sin skill estructurada)**\n> Prompt: \"Quiero escribir un libro sobre bienestar para mamás latinoamericanas que viven en Estados Unidos. Soy psicóloga clínica con 8 años de experiencia trabajando con esta comunidad.\"\n\n---\n\n## Mi respuesta al usuario\n\n¡Qué proyecto tan valioso y con una base sólida! Tienes una combinación poderosa: credibilidad clínica real, conocimiento cultural específico y un nicho que todavía tiene muy poco material publicado. Vamos a explorar esto juntos.\n\n---\n\n### Lo que hace que tu idea tenga potencial real\n\nLas mamás latinoamericanas en Estados Unidos enfrentan una intersección muy particular de presiones:\n\n- **Aculturación y choque de valores** entre la crianza \"latina\" y las normas del contexto norteamericano\n- **Maternidad en aislamiento**: lejos de la red familiar extendida (abuelas, tías) que en Latinoamérica es parte integral del apoyo materno\n- **Doble carga invisible**: ser \"la fuerte\" de la familia mientras cargan con estrés migratorio, barreras de idioma y a veces estatus migratorio incierto\n- **Brecha cultural en el acceso a salud mental**: el estigma hacia la terapia en muchas comunidades latinas es real y documentado\n- **Identidad en tensión**: mamás que se preguntan si están \"latinizando demasiado\" o \"americanizando demasiado\" a sus hijos\n\nTu experiencia de 8 años con esta comunidad te da acceso a algo que ningún investigador externo tiene: los patrones reales, las frases que usan, los miedos que no dicen en la primera sesión pero sí en la quinta.\n\n---\n\n### El mercado editorial actual\n\nBusqué referencias sobre libros existentes en este espacio. Aquí algunos títulos reales que están en circulación:\n\n**En inglés, sobre salud mental latina:**\n- **\"Self-Care for Latinas\"** de Raquel Reichard (Adams Media/Simon & Schuster) — más de 100 ejercicios de bienestar diseñados específicamente para latinas. Orientado a bienestar general, no específicamente a mamás.\n- **\"Latina/o American Health and Mental Health\"** de Leticia Arellano-Morales, Ph.D. (ABC-CLIO/Greenwood) — texto más académico/clínico sobre salud mental latina.\n- **\"12 Ways to Cope With Your Latina Mom\"** de Jasmine Cepeda — aborda dinámicas familiares y trauma generacional desde la perspectiva de hijas adultas de madres latinas.\n\n**Recursos institucionales (no libros comerciales):**\n- **Programa Alma** (investigado en PubMed, 2025): intervención de activación conductual para madres latinas hispanohablantes en período perinatal. Muestra la demanda clínica pero no es un libro de consumo masivo.\n- **Centro SOL / Johns Hopkins**: guía de bienestar para familias latinas titulada *\"Cuidarnos es resistencia\"* — orientación comunitaria, no libro comercial.\n\n**La brecha que existe:** No encontré ningún libro publicado por una psicóloga clínica latina, escrito específicamente para **madres** latinoamericanas **en EE.UU.**, en español o bilingüe, desde una perspectiva clínica pero accesible. Ese es tu espacio.\n\n---\n\n### Preguntas que necesito hacerte para ayudarte mejor\n\nAntes de profundizar en la estrategia editorial, necesito entender mejor tu visión:\n\n1. **¿En qué idioma quieres escribirlo?** ¿Español, inglés, o bilingüe (español/inglés intercalado, como hacen muchos libros para comunidades latinas en EE.UU.)?\n\n2. **¿A quién exactamente le estás hablando?** ¿Mamás recién llegadas, mamás de segunda generación, mamás en período perinatal, mamás de hijos adolescentes? ¿Hay un momento específico de la maternidad en el que se concentra tu experiencia clínica?\n\n3. **¿Cuál sería el formato del libro?** ¿Un libro de autoayuda con ejercicios prácticos? ¿Un libro narrativo con historias de casos (anonimizados)? ¿Una mezcla?\n\n4. **¿Ya tienes plataforma?** ¿Redes sociales, podcast, newsletter, hablas en congresos? Esto importa mucho para el pitch a editoriales.\n\n5. **¿Tienes preferencia de mercado editorial?** ¿Editoriales en español (Penguin Random House en español, Planeta, etc.), editoriales estadounidenses con línea latina, o autopublicación?\n\n---\n\n### Tu ventaja competitiva (credibilidad)\n\n8 años de experiencia clínica con esta comunidad específica es una credencial extraordinaria para este tipo de libro. En el mercado editorial de salud mental/autoayuda para latinas, la mayoría de los autores son:\n- Periodistas o escritores culturales (sin licencia clínica)\n- Académicos (escritura muy técnica, poca accesibilidad)\n- Influencers de bienestar (sin formación clínica)\n\nTú estás en una categoría muy escasa: **psicóloga clínica con especialización cultural demostrada**. Eso te abre puertas tanto con editoriales como con la prensa y los medios para la promoción del libro.\n\n---\n\n### Próximos pasos sugeridos\n\nUna vez que respondas las preguntas anteriores, puedo ayudarte con:\n\n- Análisis más profundo de la competencia en el nicho específico que elijas\n- Estructura de capítulos tentativa\n- Draft de propuesta editorial (book proposal)\n- Identificación de agentes literarios especializados en libros de salud latina\n- Estrategia de construcción de plataforma previa a la publicación\n\n¿Por dónde quieres empezar?\n\n---\n\n*Fuentes consultadas:*\n- [12 Books by Latinas on Mental Health - HipLatina](https://hiplatina.com/latina-mental-health-books/)\n- [Self-Care for Latinas - Simon & Schuster](https://www.simonandschuster.com/books/Self-Care-for-Latinas/Raquel-Reichard/9781507221426)\n- [Latina/o American Health and Mental Health - Porchlight Books](https://www.porchlightbooks.com/products/latinao-american-health-and-mental-health-leticia-arellanomorales-ph-d-9781440854897)\n- [Guía de bienestar para familias Latinas - Centro SOL / Johns Hopkins](https://jhcentrosol.org/fortalece-tu-bienestar/guia-de-bienestar-para-familias-latinas-cuidarnos-es-resistencia/)\n- [Programa Alma para madres latinas - PubMed](https://pubmed.ncbi.nlm.nih.gov/40010897/)\n"}]}}, {"id": "eval-4-financas-pt", "label": "🇧🇷 Finanças Jovens (PT) — Inputs Completos", "with_skill": {"config": "with_skill", "prompt": "Quero validar essa ideia: livro de educação financeira para jovens de 20-30 anos que estão começando a vida e nunca aprenderam sobre dinheiro na escola. Sou planejadora financeira certificada CFP há 7 anos, atendo principalmente millennials endividados. Meu objetivo é ter renda recorrente com o livro e construir autoridade no digital. O leitor ideal é um jovem adulto assalariado, entre 22-32 anos, com dívidas no cartão de crédito e zero de reserva de emergência.", "grading": {"run_id": "eval-4-financas-pt-with_skill", "expectations": [{"text": "A skill detecta que os 4 inputs estão presentes e vai direto para a pesquisa, SEM fazer perguntas", "passed": true, "evidence": "Todos os 4 inputs foram identificados de imediato (ideia do livro, background da autora CFP, leitor-alvo 22-32 anos endividado, objetivo de renda recorrente + autoridade digital). A análise iniciou diretamente com 4 buscas web paralelas sem nenhuma pergunta ao usuário. O documento de análise registra: 'Todos os 4 inputs identificados — análise completa iniciada sem perguntas adicionais.'"}, {"text": "Reconhece que finanças pessoais para jovens é um mercado competitivo com muitos players (Me Poupe, Dinheiro Sem Mágica, Pai Rico Pai Pobre, etc.)", "passed": true, "evidence": "A análise documenta explicitamente 10 concorrentes reais incluindo: Me Poupe! (Nathalia Arcuri, 8M seguidores YouTube), Do Mil ao Milhão (Thiago Nigro, best-seller #1 2020-2021, 15M seguidores/mês), Orçamento Sem Falhas (Nath Finanças), Gustavo Cerbasi (3M exemplares vendidos), Pai Rico Pai Pobre (9M exemplares no Brasil), O Homem Mais Rico da Babilônia (#1 Amazon Brasil 2024), além de Ramit Sethi e Erin Lowry do mercado internacional. A análise conclui: 'o nicho de finanças para jovens já está moderadamente ocupado por players com grande alcance digital.'"}, {"text": "Pontuação de Singularidade é entre 5/10 e 8/10 — reconhece que o nicho existe mas tem concorrência", "passed": true, "evidence": "Singularidade/Diferenciação recebeu pontuação 6/10. Justificativa explícita: 'Players consolidados (Arcuri, Nigro) dominam o digital, mas nenhum combina CFP + foco exclusivo em devedor jovem assalariado + linguagem acessível. Diferenciação existe mas precisa ser trabalhada com força no posicionamento.' 6/10 está dentro da faixa 5-8 especificada."}, {"text": "Entrega tabela com pelo menos 8 concorrentes reais do mercado de finanças pessoais com prós e contras", "passed": true, "evidence": "Tabela de 10 concorrentes reais entregue com colunas Título/Autor, Pontos Fortes e Pontos Fracos para cada um: (1) Me Poupe!/Arcuri, (2) Do Mil ao Milhão/Nigro, (3) Orçamento Sem Falhas/Nath Finanças, (4) Como Organizar Vida Financeira/Cerbasi, (5) Casais Inteligentes/Cerbasi, (6) O Homem Mais Rico da Babilônia/Clason, (7) Pai Rico Pai Pobre/Kiyosaki, (8) I Will Teach You to Be Rich/Sethi, (9) Broke Millennial/Lowry, (10) Dinheiro no seu Bolso/Rott. Todos com autores reais verificáveis e prós/contras distintos."}, {"text": "Gera pelo menos 8 opções de título focadas no leitor jovem endividado", "passed": true, "evidence": "10 títulos gerados, todos com foco no leitor jovem endividado: 'Zerei Minha Dívida', 'Dinheiro de Verdade', 'Mês que Vem Eu Pago', 'Geração Cartão', 'O Dinheiro Que Ninguém Te Ensinou', 'Do Cartão para a Reserva', 'Finanças Sem Mimimi', 'Primeiro Salário, Última Dívida', 'Você Não É Ruim com Dinheiro', 'Saia do Vermelho, Entre no Jogo'. Cada título acompanhado de subtítulo e ângulo estratégico. Recomendação de título também fornecida."}, {"text": "O veredicto é honesto — pode ser APROVADO ou PRECISA DE TRABALHO, mas com justificativa específica para o mercado de finanças para jovens", "passed": true, "evidence": "Veredicto: 'APROVADO COM TRABALHO E kill)  \n**Autora:** Planejadora Financeira CFP (7 anos de experiência)\n\n---\n\n## 1. RESUMO DA IDEIA\n\n| Campo | Detalhe |\n|---|---|\n| **Ideia** | Livro de educação financeira para jovens de 20–30 anos que nunca aprenderam sobre dinheiro na escola |\n| **Autora** | Planejadora financeira certificada CFP há 7 anos, atende millennials endividados |\n| **Leitor-alvo** | Jovem adulto assalariado, 22–32 anos, com dívida no cartão e zero de reserva de emergência |\n| **Objetivo** | Renda recorrente + construção de autoridade digital |\n\n> **Todos os 4 inputs identificados — análise completa iniciada sem perguntas adicionais.**\n\n---\n\n## 2. PANORAMA DO MERCADO\n\n### Contexto do problema (dados reais)\n\n- O número de jovens endividados no Brasil **dobrou em 8 anos**: de 13,7 milhões (2016) para **27,6 milhões (2024)**\n- **49% das jovens de 18–24 anos** têm dívidas de cartão de crédito\n- Apenas **25% dos jovens de 18–30 anos** fazem controle financeiro\n- O Brasil ocupa o **12º lugar em 14 países** em literacia financeira (OCDE)\n- O problema existe — o mercado editorial também já percebeu isso\n\n### Conclusão de mercado\n**O problema é real e urgente. O mercado é grande. Mas o nicho de \"finanças para jovens\" já está moderadamente ocupado por players com grande alcance digital.**\n\n---\n\n## 3. TABELA DE CONCORRENTES (10 títulos)\n\n| # | Título | Autor | Origem | Público-alvo | Pontos Fortes | Pontos Fracos |\n|---|---|---|---|---|---|---|\n| 1 | **Me Poupe! — 10 passos para nunca mais faltar dinheiro** | Nathalia Arcuri | Brasil | Iniciantes adultos | Linguagem acessível, tom humorístico, 8M seguidores YouTube, planilhas e exercícios práticos | Não é especialista certificada (CFP); abordagem genérica, não foca no jovem endividado especificamente |\n| 2 | **Do Mil ao Milhão — Sem Cortar o Cafezinho** | Thiago Nigro (O Primo Rico) | Brasil | Jovens que querem investir | Best-seller #1 de 2020 e 2021; tom motivador; 15M seguidores mensais | Foco em acumulação de riqueza, não em sair da dívida; pressupõe alguma estabilidade financeira |\n| 3 | **Orçamento Sem Falhas** | Nath Finanças (Nathália Rodrigues) | Brasil | Quem ganha pouco e quer sair do vermelho | Linguagem simples, foco em realidade de baixa renda, exemplos reais | Autor com alcance menor; foco mais estreito (baixa renda) |\n| 4 | **Como Organizar Sua Vida Financeira** | Gustavo Cerbasi | Brasil | Iniciantes e famílias | Mais de 3 milhões de exemplares vendidos, aborda IR e investimentos | Linguagem mais formal; público mais adulto (30+); não dialoga com a geração Z/millennial |\n| 5 | **Casais Inteligentes Enriquecem Juntos** | Gustavo Cerbasi | Brasil | Casais | Best-seller que virou filme; credibilidade alta | Não é sobre dívida nem voltado para solteiros jovens |\n| 6 | **O Homem Mais Rico da Babilônia** | George S. Clason | Internacional | Público geral | #1 em vendas Amazon Brasil 2024; princípios atemporais | Linguagem antiquada, sem contexto cultural brasileiro, sem abordagem de dívida moderna |\n| 7 | **Pai Rico, Pai Pobre** | Robert T. Kiyosaki | Internacional | Público geral | 9 milhões de exemplares no Brasil; conceitos de ativos e passivos | Foco em empreendedorismo e imóveis; não aborda dívida de cartão ou realidade assalariada |\n| 8 | **I Will Teach You to Be Rich** | Ramit Sethi | EUA (sem tradução ampla no BR) | Millennials americanos | Tom irreverente, cobre cartão de crédito, automação, investimentos | Não adaptado para o contexto brasileiro (CPF, FGTS, Nubank, Pix, etc.) |\n| 9 | **Broke Millennial** | Erin Lowry | EUA | Millennials com dívidas | Abordagem emocional + prática; muito bem avaliado | Não traduzido para português; não tem contexto BR |\n| 10 | **Dinheiro no seu Bolso — Guia fácil para liberdade financeira** | Jason Rott | Brasil (ebook) | Millennials e trabalhadores | Disponível em português; aborda múltiplos públicos | Autor sem alcance digital relevante; formato ebook limita visibilidade |\n\n---\n\n## 4. MAPA DE POSICIONAMENTO\n\n*(Veja o arquivo `Mapa_Posicionamento_Financas.html` para o gráfico interativo)*\n\n**Eixos do mapa:**\n- **X:** Acessibilidade da linguagem (técnico ↔ popular)\n- **Y:** Foco no leitor endividado (investidor ↔ devedor)\n\n**Posição identificada para o livro da autora:**\n> Linguagem acessível + foco no devedor jovem + credencial CFP = **quadrante com menor concorrência**\n\nO gap real está em: **livro escrito por profissional certificado (CFP), em linguagem jovem, especificamente para quem tem dívida de cartão e zero de reserva.** Nenhum dos concorrentes principais combina as três coisas ao mesmo tempo.\n\n---\n\n## 5. DEZ OPÇÕES DE TÍTULO\n\n| # | Título | Subtítulo sugerido | Ângulo |\n|---|---|---|---|\n| 1 | **Zerei Minha Dívida** | *O guia CFP para jovens que o banco não quer que você leia* | Provocador, anti-establishment |\n| 2 | **Dinheiro de Verdade** | *Para jovens que trabalham, se endividam e nunca aprenderam a sair do buraco* | Direto, empático |\n| 3 | **Mês que Vem Eu Pago** | *Como parar de adiar sua vida financeira e começar agora* | Autoconhecimento + humor |\n| 4 | **Geração Cartão** | *O manual de sobrevivência financeira para quem cresceu sem educação sobre dinheiro* | Identitário, geracional |\n| 5 | **O Dinheiro Que Ninguém Te Ensinou** | *7 anos atendendo millennials endividados me ensinaram isso* | Credencial + curiosidade |\n| 6 | **Do Cartão para a Reserva** | *O plano real de uma planejadora CFP para você sair do vermelho em 12 meses* | Promessa concreta + prazo |\n| 7 | **Finanças Sem Mimimi** | *Para quem já cansou de ouvir \"corta o cafezinho\" e quer um plano que funcione de verdade* | Reação ao mercado, viral |\n| 8 | **Primeiro Salário, Última Dívida** | *O guia definitivo para adultos jovens que querem parar de chegar no vermelho todo mês* | Jornada do herói |\n| 9 | **Você Não É Ruim com Dinheiro** | *Foi o sistema que não te ensinou — e aqui está o que você deveria ter aprendido* | Empoderamento, vira viral |\n| 10 | **Saia do Vermelho, Entre no Jogo** | *O plano de uma planejadora financeira certificada para jovens que ganham pouco e devem muito* | Credencial + realidade |\n\n**Recomendação de título:** *\"Você Não É Ruim com Dinheiro\"* — combina empoderamento, desconstrução de culpa e potencial viral. *\"Mês que Vem Eu Pago\"* tem forte apelo de identificação imediata.\n\n---\n\n## 6. PONTUAÇÃO DE PUBLICABILIDADE\n\n### Dimensão 1 — Potencial de Mercado: **8/10**\n\n**Justificativa:** O mercado é real e crescente. 27,6 milhões de jovens endividados no Brasil representam uma demanda enorme. O segmento de educação financeira é consistentemente um dos mais vendidos no país. O leitor-alvo (22–32 anos, assalariado, endividado) é um perfil de alta identificação e urgência de compra. Perda de 2 pontos pelo risco de saturação perceptual — o consumidor pode sentir que \"já tem muita coisa assim\".\n\n### Dimensão 2 — Singularidade/Diferenciação: **6/10**\n\n**Justificativa:** O nicho de finanças para jovens existe e tem players consolidados com grandes audiências (Nathalia Arcuri, Thiago Nigro). Porém, **nenhum deles combina credencial CFP + foco exclusivo no devedor jovem assalariado + tom de quem atende esses clientes há 7 anos no consultório.** A diferenciação existe, mas precisa ser trabalhada com força no posicionamento e no marketing. Não é um livro sem concorrentes — é um livro com vantagem posicional específica.\n\n### Dimensão 3 — Autoridade da Autora: **8/10**\n\n**Justificativa:** A credencial CFP é forte e diferenciadora — poucos livros do segmento são escritos por planejadores certificados. 7 anos atendendo exatamente o público do livro é ouro para credibilidade e casos reais. A perda de 2 pontos é pela ausência (mencionada) de audiência digital pré-existente — livros de finanças hoje dependem muito do canal do autor. Isso é reversível e parte do objetivo declarado (construir autoridade digital).\n\n### PONTUAÇÃO COMPOSTA: **7,3/10**\n\n---\n\n## 7. VEREDICTO\n\n### ✅ APROVADO COM TRABALHO ESTRATÉGICO\n\n**O livro tem fundamento sólido, mas o mercado exige posicionamento cirúrgico.**\n\n**Aprovado porque:**\n- O problema social (jovens endividados no Brasil) é documentado e crescente\n- A credencial CFP é genuinamente escassa no mercado editorial brasileiro de finanças populares\n- Existe um gap real: nenhum best-seller atual foca especificamente no jovem assalariado com dívida de cartão + zero de reserva, escrito por especialista certificado\n- O objetivo (renda recorrente + autoridade digital) é viável e o livro é o produto central certo para essa estratégia\n\n**Condições para sucesso:**\n1. **Posicionamento contra os players grandes, não com eles.** Não tente ser o \"próximo Me Poupe!\" — seja o livro que \"vai além\" do Me Poupe! para quem quer um plano real de sair da dívida\n2. **Construir audiência digital em paralelo** (Instagram/TikTok financeiro) antes ou durante o lançamento — sem isso, o livro depende 100% de editora\n3. **Casos reais de clientes** (anonimizados) são o diferencial narrativo que nenhum concorrente pode copiar\n4. **Abordagem de sair da dívida ANTES de falar em investimento** — esse sequenciamento correto é o que o mercado ainda não entregou bem para jovens\n5. **Titular com identificação emocional forte** — o título precisa fazer o jovem sentir que o livro foi escrito para ele, não para um adulto genérico\n\n**Risco principal:** Sem plataforma digital estabelecida, a editora pode ter dificuldade em justificar o avanço. Recomenda-se lançar o livro em paralelo ou logo após atingir ~10K seguidores engajados em um canal de conteúdo.\n\n---\n\n## 8. RECOMENDAÇÕES ESTRATÉGICAS\n\n| Ação | Prioridade | Prazo sugerido |\n|---|---|---|\n| Definir ângulo único do livro (ex: \"sair da dívida antes de investir\") | Alta | Imediato |\n| Criar perfil no Instagram/TikTok com conteúdo para o leitor-alvo | Alta | Antes do lançamento |\n| Mapear 5–10 casos de clientes reais (com permissão) para usar no livro | Alta | Fase de escrita |\n| Pesquisar editoras com catálogo de finanças (Sextante, HarperCollins BR, Planeta) | Média | 30–60 dias |\n| Testar 3 títulos com enquete para a audiência-alvo | Média | Após ter audiência mínima |\n| Considerar lançamento via Kindle/autopublicação como validação antes da editora tradicional | Baixa | Opcional |\n\n---\n\n*Análise gerada pela skill Validador de Ideias Literárias — Senior Publishing Strategist*  \n*Baseada em pesquisa de mercado com dados reais do mercado editorial brasileiro e internacional (maio 2026)*\n"}]}, "without_skill": {"config": "without_skill", "prompt": "Quero validar essa ideia: livro de educação financeira para jovens de 20-30 anos que estão começando a vida e nunca aprenderam sobre dinheiro na escola. Sou planejadora financeira certificada CFP há 7 anos, atendo principalmente millennials endividados. Meu objetivo é ter renda recorrente com o livro e construir autoridade no digital. O leitor ideal é um jovem adulto assalariado, entre 22-32 anos, com dívidas no cartão de crédito e zero de reserva de emergência.", "grading": {"run_id": "eval-4-financas-pt-without_skill", "expectations": [{"text": "A skill detecta que os 4 inputs estão presentes e vai direto para a pesquisa, SEM fazer perguntas", "passed": true, "evidence": "O assistente genérico não fez nenhuma pergunta de esclarecimento — foi direto à pesquisa e à análise, pois todos os 4 inputs estavam presentes no prompt (ideia do livro, perfil da autora, objetivo, leitor ideal)."}, {"text": "Reconhece que finanças pessoais para jovens é um mercado competitivo com muitos players (Me Poupe, Dinheiro Sem Mágica, Pai Rico Pai Pobre, etc.)", "passed": true, "evidence": "A análise afirma explicitamente: 'Finanças pessoais para jovens é um dos segmentos mais competitivos do mercado editorial brasileiro' e cita Me Poupe (Nathalia Arcuri), Do Mil ao Milhão (Thiago Nigro/O Primo Rico), Pai Rico Pai Pobre, O Homem Mais Rico da Babilônia, e outros. Nota: 'Dinheiro Sem Mágica' não foi **Do Mil ao Milhão** — Thiago Nigro (O Primo Rico) | Acumulação de riqueza: gastar bem, investir melhor, ganhar mais | Fortíssima presença digital; linguagem direta e aspiracional para jovens | Focado em quem já quer investir, não em quem está no vermelho no cartão |\n| 3 | **Pai Rico, Pai Pobre** — Robert Kiyosaki | Mentalidade de riqueza vs. mentalidade de empregado | Best-seller global com 30+ milhões de cópias; muda a mentalidade | Contexto americano; não aborda dívidas de cartão do brasileiro comum |\n| 4 | **O Homem Mais Rico da Babilônia** — George S. Clason | Princípios básicos: poupar, investir, evitar dívidas | Atemporal, acessível, narrativa em parábolas | Muito genérico; não fala com o jovem assalariado brasileiro de hoje |\n| 5 | **Como Organizar Sua Vida Financeira** — Gustavo Cerbasi | Organização financeira pessoal e familiar | Autor com 3 milhões de cópias vendidas; extremamente confiável no Brasil | Linguagem mais formal/acadêmica; não é específico para jovens endividados |\n| 6 | **Casais Inteligentes Enriquecem Juntos** — Gustavo Cerbasi | Finanças em casal | Aborda um nicho específico (casais); muito prático | Não foca em jovens solteiros endividados; pressupõe estabilidade mínima |\n| 7 | **A Psicologia Financeira** — Morgan Housel | Comportamento humano nas decisões financeiras | Escrita brilhante; best-seller mundial em 2023-2024; muito relevante para millennials | Não é um guia de ação; não resolve o problema prático do cartão no limite |\n| 8 | **12 Meses para Enriquecer** — Marcos Silvestre | Plano prático passo a passo para sair das dívidas e investir | Abordagem prática e estruturada; foco em redução de dívidas | Menor presença de marca/digital; menos conhecido que os anteriores |\n| 9 | **Nath Finanças (Nathália Rodrigues)** — Conteúdo digital + livro | Finanças com linguagem popular, foco em cartão de crédito e controle de gastos | Muito próxima do público endividado; linguagem sem jargão; forte no TikTok/Instagram | Livro ainda menos estabelecido que os grandes players |\n| 10 | **Me Chama de Bruna** — Bruna Castanheira (conteúdo) | Dinheiro para mulheres jovens | Nicho bem definido (mulheres); linguagem coloquial | Foco de gênero específico; não abrange todos os jovens |\n\n---\n\n## Pontuação de Singularidade\n\n**6,5 / 10**\n\n**Justificativa:**\n\nO tema \"finanças para jovens\" é amplamente coberto. Contudo, há um ponto de diferenciação real e subexplorado em formato de livro: a perspectiva de uma **planejadora financeira certificada (CFP) que atende diretamente esse público na prática clínica** — ou seja, alguém que não está falando de teoria, mas de casos reais de millennials endividados que ela atendeu.\n\nOs grandes players (Nathalia Arcuri, Thiago Nigro) têm audiência, mas não são CFPs com 7 anos de consultoria especializada em endividamento. Cerbasi tem credenciais, mas fala para um público mais maduro. Nath Finanças tem a linguagem, mas não tem a profundidade técnica da certificação.\n\n**O que diminui a singularidade:** o tema é muito explorado, o mercado digital já entrega muito conteúdo gratuito, e o jovem endividado precisa ser convencido a pagar por um livro.\n\n**O que aumenta:** credencial CFP + foco específico em endividamento de cartão + perspectiva de quem senta do outro lado da mesa com esses jovens todo dia.\n\n---\n\n## O Diferencial que Precisa Ficar Claro\n\nA maioria dos livros de finanças para jovens fala sobre **como enriquecer**. Poucos falam sobre **como sair do buraco antes de pensar em enriquecer**. Esse é o ponto de entrada real do seu leitor: ele não tem reserva de emergência e está pagando juros rotativos do cartão. Ele precisa de um livro que comece onde ele está — não onde ele deveria estar.\n\nSe o livro começar com \"invista 10% do seu salário todo mês\", você perdeu o leitor na página 1. Se começar com \"você abriu a fatura do cartão e sentiu aquele frio no estômago — esse livro é pra você\", você acertou o tom.\n\n---\n\n## Sugestões de Título (foco no leitor jovem endividado)\n\n1. **Sai do Vermelho** — O guia definitivo para o jovem que nunca aprendeu sobre dinheiro na escola\n2. **Fatura no Limite** — Como uma planejadora financeira ajudou centenas de jovens a sair das dívidas (e como ela pode te ajudar também)\n3. **Seu Dinheiro, Suas Regras** — O manual financeiro que a escola nunca te deu\n4. **Zero a Zero** — Do endividamento ao equilíbrio: um plano real para jovens de verdade\n5. **Sem Malabarismo** — Finanças pessoais sem fórmulas mágicas para quem está começando do zero (ou do menos)\n6. **O Dinheiro que Você Não Vê** — Como o cartão de crédito está te roubando sem você perceber\n7. **Geração Endividada** — O livro que os millennials precisavam ter lido antes\n8. **Começa Aqui** — O guia financeiro para quem tem mais dívidas do que sonhos (ainda)\n9. **Plano B Para o Seu Dinheiro** — Estratégias reais de uma CFP para jovens que ninguém ensinou a lidar com grana\n10. **Na Faixa dos 20 e Tantos** — Um plano financeiro honesto para quem está se virando sozinho pela primeira vez\n\n---\n\n## Estratégia para Renda Recorrente + Autoridade Digital\n\nO livro sozinho dificilmente gera renda recorrente de forma sustentável. O livro é a **porta de entrada** para um ecossistema maior. Com sua credencial CFP e público já estabelecido (você atende millennials endividados), o caminho natural é:\n\n1. **Livro** → gera autoridade, visibilidade, credibilidade\n2. **Conteúdo digital** (Instagram, TikTok, YouTube Shorts) → alimenta o funil com o público do livro\n3. **Produto recorrente** → curso online, mentoria em grupo, assinatura de newsletter paga, planilhas e ferramentas de diagnóstico financeiro\n\nO livro por si só tende a ter uma única onda de vendas. A renda recorrente vem dos produtos digitais que o livro ancora.\n\n---\n\n## Veredicto\n\n### APROVADO COM RESSALVAS — PRECISA DE POSICIONAMENTO CIRÚRGICO\n\nA ideia tem fundamento real: você tem credencial, experiência prática com o público-alvo exato e um problema
