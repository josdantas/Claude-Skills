[project]
name = "arca"
version = "0.0.1"
description = "Arquivo de Contexto Auditável — memória externa para IA com procedência, cifra e esquecimento verificável"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "argon2-cffi>=23",
    "numpy>=2",
]

[project.optional-dependencies]
bench = ["lancedb>=0.24", "pyarrow>=17"]

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
